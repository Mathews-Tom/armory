name: Package All

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/ci-task.yml
    with:
      task: package
      bun: true
      # No base means all packages. Queue/main/tag builds always validate the
      # checked-out integration candidate; only PR archives may be selected.
      base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  package:
    name: package
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Required package readiness
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci.py ready --needs "$CI_NEEDS" --expect build

  release:
    # Never release PR refs, merge queue candidates, or manually supplied refs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.6.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist
      - name: Write release notes
        if: github.ref == 'refs/heads/main'
        run: |
          cat > dist-notes.md <<'NOTES'
          Rolling release — automatically updated on every push to `main`.

          Contains the latest packaged archives from the repository.
          For stable releases, use a versioned tag (e.g., `v1.0.0`).
          NOTES
          echo "" >> dist-notes.md
          echo "**Last updated:** ${GITHUB_SHA}" >> dist-notes.md
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python scripts/sync_release_assets.py \
            --tag "${GITHUB_REF_NAME}" --dist dist --target "${GITHUB_SHA}" --prune
      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python scripts/sync_release_assets.py \
            --tag latest --dist dist --target "${GITHUB_SHA}" \
            --title "Latest Packages (rolling)" --notes-file dist-notes.md \
            --prerelease --no-make-latest
