name: Package All

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Packaging used to be main-only, so a break in it was invisible until after merge.
  # PRs run every build and validation step; the release steps below stay gated on
  # main and tags.
  pull_request:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate manifest
        run: |
          python scripts/generate_manifest.py
          git diff --exit-code manifest.yaml

      - name: Generate and validate adapters
        run: python scripts/generate_adapters.py --validate

      - name: Package adapter artifacts
        run: |
          mkdir -p dist
          # tar records mtimes and gzip records its own timestamp, so an unchanged
          # tree still produced a different tarball on every run. Pinning both keeps
          # the artifacts byte-identical, which is what checksum-based release syncing
          # and download verification depend on.
          pack() {
            dir="$1"; out="$2"; shift 2
            tar --sort=name \
                --mtime='UTC 1980-01-01' \
                --owner=0 --group=0 --numeric-owner \
                --format=gnu \
                -cf - -C "${dir}" "$@" | gzip -n > "dist/${out}"
          }
          pack adapters/cursor armory-cursor.tar.gz .cursor
          pack adapters/codex  armory-codex.tar.gz AGENTS.md standards agents workflows skills
          pack adapters/gemini armory-gemini.tar.gz .gemini
          echo "Adapter artifacts:"
          ls -lh dist/armory-*.tar.gz

      - name: Package all items
        run: |
          mkdir -p dist
          DEFINITION_MAP="skills:SKILL.md agents:AGENT.md hooks:HOOK.md rules:RULE.md commands:COMMAND.md utilities:UTILITY.md presets:PRESET.md"

          for mapping in $DEFINITION_MAP; do
            type_dir="${mapping%%:*}"
            def_file="${mapping#*:}"
            if [ -d "${type_dir}" ]; then
              for pkg_dir in ${type_dir}/*/; do
                if [ -f "${pkg_dir}${def_file}" ]; then
                  echo "Packaging ${pkg_dir}..."
                  python scripts/package.py "${pkg_dir}" --output-dir dist
                else
                  echo "Skipping ${pkg_dir} — no ${def_file} found"
                fi
              done
            fi
          done

      - name: Write release notes
        if: github.ref == 'refs/heads/main'
        run: |
          cat > dist-notes.md <<'NOTES'
          Rolling release — automatically updated on every push to `main`.

          Contains the latest packaged archives from the repository.
          For stable releases, use a versioned tag (e.g., `v1.0.0`).
          NOTES
          echo "" >> dist-notes.md
          echo "**Last updated:** ${{ github.sha }}" >> dist-notes.md

      # Both release steps sync through scripts/sync_release_assets.py rather than
      # re-uploading dist/* wholesale. Uploading every artifact on every push cost two
      # API calls per package in a burst and eventually failed the job with GitHub's
      # secondary rate limit. The script compares each artifact against a checksums.txt
      # manifest stored on the release and uploads only what changed, with throttled
      # batches and retry-with-backoff for the cold-start case.
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python scripts/sync_release_assets.py \
            --tag "${GITHUB_REF_NAME}" \
            --dist dist \
            --target "${GITHUB_SHA}" \
            --prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/sync_release_assets.py \
            --tag latest \
            --dist dist \
            --target "${GITHUB_SHA}" \
            --title "Latest Packages (rolling)" \
            --notes-file dist-notes.md \
            --prerelease \
            --no-make-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
