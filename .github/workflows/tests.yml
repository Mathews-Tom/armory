name: Tests

# Nothing ran pytest before this workflow existed: `just test` covered the
# repo-level suite only, and no workflow invoked it at all. Package test
# suites shipped inside skills/, agents/, and the other package trees were
# therefore never executed by CI, so drift in them landed on main unnoticed.

on:
  # No base-branch filter: a pull request stacked on another pull request's
  # branch must be gated too, or the middle of a stack merges untested.
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      # Pinned like the actions above: an unpinned toolchain makes the gate's
      # own version drift between runs.
      - name: Install uv
        run: pip install uv==0.6.14

      # --locked asserts uv.lock is already current for pyproject.toml, so a
      # dependency edited without re-locking fails here rather than on some
      # later clean install. (--frozen would install the lock as-is and skip
      # that check.)
      - name: Install project environment
        run: uv sync --locked

      # The Bun version comes from the packageManager field of
      # extensions/package.json, the workspace's single pin; bun.lock pins every
      # TypeScript dependency, including the OMP SDK the adapters type-check
      # against.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: extensions/package.json

      - name: Install extension workspace
        run: bun install --cwd extensions --frozen-lockfile

      # The locked SDK package also provides the native omp binary. Expose that
      # exact installed version without a global install or credential changes.
      - name: Expose pinned OMP native host
        run: echo "${GITHUB_WORKSPACE}/extensions/node_modules/.bin" >> "${GITHUB_PATH}"

      # Version and per-platform SHA-256 live only in extensions/native-hosts.json;
      # the binary serves `claude plugin validate/test`, never a signed-in session.
      - name: Provision pinned Claude Code for static mod validation
        run: |
          uv run python scripts/acquire_claude.py --dest "${RUNNER_TEMP}/claude-code"
          echo "${RUNNER_TEMP}/claude-code" >> "${GITHUB_PATH}"

      - name: Verify shared template synchronization
        run: uv run python scripts/sync_templates.py

      - name: Ship workflow lint and strict types
        run: |
          uv run ruff check skills/ship-workflow/scripts skills/ship-workflow/tests
          uv run ruff format --check skills/ship-workflow/scripts skills/ship-workflow/tests
          uv run mypy --strict skills/ship-workflow/scripts

      - name: Appraise lint and strict types
        run: |
          uv run ruff check skills/appraise/scripts skills/appraise/tests
          uv run ruff format --check skills/appraise/scripts skills/appraise/tests
          uv run mypy --strict skills/appraise/scripts

      - name: Skill inventory lint and strict types
        run: |
          uv run ruff check utilities/skill-inventory/scripts utilities/skill-inventory/tests
          uv run ruff format --check utilities/skill-inventory/scripts utilities/skill-inventory/tests
          uv run mypy --strict utilities/skill-inventory/scripts

      # follow-imports=silent scopes strict typing to the extension tooling
      # itself; the legacy validators it reuses predate strict typing.
      - name: Extension tooling lint and strict types
        run: |
          uv run ruff check scripts/build_extensions.py scripts/check_extensions.py scripts/extension_metadata.py scripts/extension_lifecycle.py scripts/acquire_claude.py tests/test_extension*.py tests/test_omp_native_gate.py extensions/verification-receipts/tests/omp-smoke.py
          uv run ruff format --check scripts/build_extensions.py scripts/check_extensions.py scripts/extension_metadata.py scripts/extension_lifecycle.py scripts/acquire_claude.py tests/test_extension*.py tests/test_omp_native_gate.py extensions/verification-receipts/tests/omp-smoke.py
          uv run mypy --strict --follow-imports=silent scripts/build_extensions.py scripts/check_extensions.py scripts/extension_metadata.py scripts/extension_lifecycle.py scripts/acquire_claude.py tests/test_omp_native_gate.py extensions/verification-receipts/tests/omp-smoke.py

      - name: Extension workspace typecheck, lint, tests and build
        run: |
          bun run --cwd extensions typecheck
          bun run --cwd extensions lint
          bun run --cwd extensions test
          bun run --cwd extensions build

      # Selects each feature's gate from its committed files: registered
      # features run the full gate plus native smoke, unregistered prefixes run
      # their implemented stage, and the catalog check always runs. There is no
      # caller-controlled skip.
      - name: Native extension gates selected by committed files
        run: uv run python scripts/check_extensions.py --ci

      - name: Repo-level tests
        run: uv run python -m pytest tests/ -q

      # Mirrors the `test-packages` recipe in justfile; CI cannot assume `just`
      # is installed. One pytest process per package, because each package's
      # tests/conftest.py prepends its own scripts/ dir to sys.path and a
      # shared process would resolve a same-named module to whichever package
      # loaded first. Native extensions carry Bun tests, run by the extension
      # workspace step above.
      - name: Package test suites
        shell: bash
        run: |
          shopt -s nullglob
          ran=0
          for type_dir in skills agents hooks rules commands utilities presets; do
            for suite in "${type_dir}"/*/tests; do
              cases=("${suite}"/test_*.py)
              [ ${#cases[@]} -eq 0 ] && continue
              echo "==> ${suite}"
              uv run python -m pytest "${suite}" -q
              ran=$((ran + 1))
            done
          done
          if [ "${ran}" -eq 0 ]; then
            echo "no package test suites found" >&2
            exit 1
          fi
