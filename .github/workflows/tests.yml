name: Tests

on:
  # Every PR base is validated, including intermediate stack branches.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# Only superseded runs of the same PR cancel. Integration, main and release
# events use unique groups, so they cannot cancel each other or a PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python scripts/ci.py select --base "$CI_BASE"

  python-checks:
    strategy:
      fail-fast: false
      matrix:
        task: [templates, ci-tooling, ship, appraise, inventory, extension-tooling]
    uses: ./.github/workflows/ci-task.yml
    with:
      task: ${{ matrix.task }}

  repo-tests:
    uses: ./.github/workflows/ci-task.yml
    with:
      task: repo-tests
      native: true

  package-tests:
    needs: selection
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.selection.outputs.suites) }}
    uses: ./.github/workflows/ci-task.yml
    with:
      task: suite
      suite: ${{ matrix.suite }}
      # Preserve the old test environment, not just test discovery. Each suite
      # has its own interpreter process, including packages' engine/tests.
      native: true

  extension-workspace:
    uses: ./.github/workflows/ci-task.yml
    with:
      task: extension-workspace
      bun: true

  extension-offline:
    uses: ./.github/workflows/ci-task.yml
    with:
      task: extension-offline
      native: true

  tests:
    name: tests
    if: always()
    needs: [selection, python-checks, repo-tests, package-tests, extension-workspace, extension-offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Required readiness
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci.py ready --needs "$CI_NEEDS"
          --expect selection python-checks repo-tests package-tests extension-workspace extension-offline
