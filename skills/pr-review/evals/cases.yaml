cases:
  - id: review_buggy_diff
    prompt: "Review this diff for issues before I merge."
    fixtures: ["fixtures/buggy_diff.patch"]
    rubric:
      - "identifies plaintext password comparison as CRITICAL security issue (was bcrypt, now raw comparison)"
      - "identifies bare except with pass as silent failure"
      - "classifies the security regression as Critical severity"
      - "classifies silent failure as Important or Critical"
      - "includes file:line references for both findings"
      - "recommends reverting to bcrypt comparison"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)critical|CRITICAL"
        weight: 1.0
      - type: matches_regex
        target: "(?i)password|bcrypt|security"
        weight: 0.8
      - type: matches_regex
        target: "(?i)silent failure|bare except|except.*pass"
        weight: 0.8
      - type: matches_regex
        target: "\\w+\\.\\w+:\\d+"
        weight: 0.6
      - type: matches_regex
        target: "(?i)revert|fix|recommend"
        weight: 0.6

  - id: review_unstaged_changes
    prompt: "Review my changes before I commit."
    fixtures: []
    rubric:
      - "uses git diff to identify changed files"
      - "applies code review dimension at minimum"
      - "produces severity-ranked findings (Critical/Important/Suggestion)"
      - "includes file:line references"
      - "acknowledges strengths if any"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)critical|important|suggestion"
        weight: 1.0
      - type: matches_regex
        target: "(?i)git diff"
        weight: 0.8
      - type: matches_regex
        target: "\\w+\\.\\w+:\\d+|file.*line"
        weight: 0.6
      - type: matches_regex
        target: "(?i)finding|issue|review"
        weight: 0.6

  - id: specific_dimension_request
    prompt: "Check my code for silent failures and error handling issues."
    fixtures: []
    rubric:
      - "activates error handling dimension specifically"
      - "loads error-handling reference"
      - "examines try/catch/except blocks"
      - "classifies findings by CRITICAL/HIGH/MEDIUM"
      - "does not run unrelated dimensions (test analysis, type design)"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)error.handling|silent.failure"
        weight: 1.0
      - type: matches_regex
        target: "CRITICAL|HIGH|MEDIUM"
        weight: 0.8
      - type: matches_regex
        target: "(?i)try|catch|except"
        weight: 0.6
      - type: matches_regex
        target: "(?i)finding|issue"
        weight: 0.6

  - id: architecture_review_request
    prompt: "Review the overall architecture of our system for scalability."
    fixtures: []
    rubric:
      - "does not activate pr-review workflow (architecture-reviewer territory)"
    trigger_expected: false

  - id: test_generation_request
    prompt: "Write tests for this function I just changed."
    fixtures: []
    rubric:
      - "does not activate pr-review workflow (test-harness territory)"
    trigger_expected: false

  - id: substantive_review_without_polish_loop
    prompt: |
      Re-review this null-handling fix in a report-export PR. The preceding pass already reviewed the remaining
      code; the public contract and base are unchanged. Required checks and the export smoke pass. The only new
      bot suggestions are to rename a local variable and add a generic exporter registry for a hypothetical
      second format. This is the third feedback-answering round. Report merge blockers, not an implementation.

      Contract: None and an empty list produce ""; non-empty rows are joined with "\n" without alteration.
      Changed code and its complete affected caller:

      ```diff
      --- a/reports.py
      +++ b/reports.py
      @@ -1,2 +1,4 @@
       def export_report(rows: list[str] | None) -> str:
      +    if rows is None:
      +        return ""
           return "\n".join(rows)
      ```

      ```python
      # downloads.py (unchanged caller)
      from reports import export_report

      def download_report(rows: list[str] | None) -> str:
          return export_report(rows)
      ```

      Explain the changed null handling and affected caller. Conclude with "Blockers: none" or
      "Blockers: <concrete defect>", and "Optional suggestions: blocking" or
      "Optional suggestions: non-blocking", one decision per line.
    fixtures: []
    rubric:
      - "reviews changed null handling and affected callers rather than restarting unchanged dimensions"
      - "does not turn optional naming or unused extensibility into blocking findings or commits"
      - "does not manufacture a finding quota or derive severity from confidence alone"
      - "if a substantive defect remains, reports the recurring issue for an owner decision rather than starting round four"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: '(?im)^Blockers:\s*none\s*$'
        weight: 1.0
      - type: matches_regex
        target: '(?im)^Optional suggestions:\s*non-blocking\s*$'
        weight: 0.9
      - type: matches_regex
        target: '(?i)\bnull\b|\bNone\b'
        weight: 0.9
      - type: matches_regex
        target: '(?i)\bdownload_report\b'
        weight: 0.9
