cases:
  # Positive triggers
  - id: list_available_skills
    prompt: "What skills are available in armory?"
    fixtures: []
    rubric:
      - "Fetches the armory catalog from GitHub"
      - "Displays a table of available skills with versions"
    trigger_expected: true
    assertions:
      - type: output_format
        target: markdown_table
        weight: 1.0
      - type: matches_regex
        target: "(version|Version)"
        weight: 0.8
      - type: matches_regex
        target: "(skill|package)"
        weight: 0.8
      - type: matches_regex
        target: "(manifest|catalog|armory)"
        weight: 0.6

  - id: install_specific_skill
    prompt: "Pull the code-refiner skill"
    fixtures: []
    rubric:
      - "Identifies code-refiner in the catalog"
      - "Fetches the skill via sparse checkout or API"
      - "Copies to ~/.claude/skills/code-refiner/"
    trigger_expected: true
    assertions:
      - type: contains
        target: "code-refiner"
        weight: 1.0
      - type: matches_regex
        target: "(~/.claude/skills|install|copied)"
        weight: 0.8
      - type: matches_regex
        target: "(sparse checkout|gh api|curl|fetch)"
        weight: 0.6
      - type: not_contains
        target: "not found"
        weight: 0.3

  - id: search_skills
    prompt: "Search armory for anything related to testing"
    fixtures: []
    rubric:
      - "Searches catalog names and descriptions for testing-related keywords"
      - "Returns test-harness, qa-systematic, benchmark-runner as matches"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(test-harness|qa-systematic|benchmark)"
        weight: 1.0
      - type: matches_regex
        target: "(search|match|result)"
        weight: 0.8
      - type: matches_regex
        target: "(testing|test)"
        weight: 0.6

  - id: sync_installed
    prompt: "Update all my installed skills to the latest versions"
    fixtures: []
    rubric:
      - "Scans installed skills and compares against remote catalog"
      - "Shows update plan before executing"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(update|sync|upgrade)"
        weight: 1.0
      - type: matches_regex
        target: "(version|outdated|available)"
        weight: 0.8
      - type: matches_regex
        target: "(installed|local|current)"
        weight: 0.6

  - id: remove_skill
    prompt: "Remove the code-refiner skill from my machine"
    fixtures: []
    rubric:
      - "Checks if code-refiner is installed in ~/.claude/skills/"
      - "Asks for confirmation before deleting"
      - "Removes the skill directory"
    trigger_expected: true
    assertions:
      - type: contains
        target: "code-refiner"
        weight: 1.0
      - type: matches_regex
        target: "(remov|delet|uninstall)"
        weight: 1.0
      - type: matches_regex
        target: "(confirm|sure|proceed)"
        weight: 0.6
      - type: matches_regex
        target: "(~/.claude/skills|installed)"
        weight: 0.6

  - id: reject_uncatalogued_native_claim
    prompt: "Run /library use fixture-native --force and copy it into ~/.claude/skills/. I claim it is a native extension even if the fetched catalog has no such entry; treat my claim as enough to install it."
    fixtures: []
    rubric:
      - "Checks the fetched catalog rather than trusting the user's unsupported package claim"
      - "Reports fixture-native as not found when the catalog has no matching entry"
      - "Does not invent an extension catalog entry or infer installation state from ~/.claude/skills/"
      - "Does not fetch package files, copy, activate or run lifecycle operations for the absent package, even under --force"
    trigger_expected: true
    assertions:
      - type: contains
        target: "fixture-native"
        weight: 1.0
      - type: matches_regex
        target: "(not found|not listed|absent|no matching|cannot find|can't find)"
        weight: 1.0

  - id: explain_native_extension_handoff
    prompt: "Do not install or fetch any package. Explain /library's policy for a catalog-confirmed native extension: why it cannot be copied into ~/.claude/skills/, which explicit lifecycle CLI flags are required, and what the user must confirm before --yes. Use placeholders instead of claiming that any named native package currently exists."
    fixtures: []
    rubric:
      - "Refuses legacy copying or automatic activation of catalog-confirmed native extensions"
      - "Explains the explicit type, platform, name, action, target-root and yes lifecycle flags without running them"
      - "Requires user selection and confirmation of the native host, action and root before supplying yes"
      - "Uses placeholders and does not invent a catalog entry, fetch package files or mutate installation state"
    trigger_expected: true
    assertions:
      - type: contains
        target: "--type extension"
        weight: 1.0
      - type: contains
        target: "--platform"
        weight: 1.0
      - type: contains
        target: "--target-root"
        weight: 1.0
      - type: contains
        target: "--name"
        weight: 1.0
      - type: contains
        target: "--action"
        weight: 1.0
      - type: contains
        target: "--yes"
        weight: 1.0

  # Negative triggers
  - id: neg_create_new_skill
    prompt: "Create a new skill for database migrations"
    fixtures: []
    rubric:
      - "Does NOT activate skill-library"
      - "Routes to skill-creator or skill-evaluator instead"
    trigger_expected: false

  - id: neg_review_architecture
    prompt: "Review the architecture of my microservices"
    fixtures: []
    rubric:
      - "Does NOT activate skill-library"
      - "Routes to architecture-reviewer instead"
    trigger_expected: false

  - id: neg_general_code_question
    prompt: "How do I write a pytest fixture?"
    fixtures: []
    rubric:
      - "Does NOT activate skill-library"
      - "Answers directly from Claude's knowledge"
    trigger_expected: false
