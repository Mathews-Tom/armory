cases:
  - id: parallelize_two_prs
    prompt: "I've got PR #482 and PR #491 open in this repo, both mine, touching completely different files. Can you drive both to merge-ready at the same time instead of one after another?"
    fixtures: []
    rubric:
      - "activates the pr-swarm skill rather than driving the PRs sequentially"
      - "runs the independence check (Phase 2) before creating any worktree"
      - "creates one isolated git worktree per PR with an inferred branch/worktree name"
      - "launches one independent headless Claude Code session per PR, not task subagents"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "worktree"
        weight: 0.9
      - type: matches_regex
        target: "independen"
        weight: 0.8
      - type: matches_regex
        target: "claude -p"
        weight: 0.7

  - id: three_pr_fleet
    prompt: "Own-PR-to-green fleet: I need #201, #205, and #212 all driven to CI-green concurrently, each with its own session so their context doesn't mix."
    fixtures: []
    rubric:
      - "activates the pr-swarm skill for three PRs"
      - "infers each worktree/branch name from the PR's headRefName rather than asking the user to supply names"
      - "enforces no cross-lane reference between the three PRs"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "headRefName|branch"
        weight: 0.7
      - type: matches_regex
        target: "isolat|no cross-lane|does not reference"
        weight: 0.7

  - id: pr_with_existing_ci_failures
    prompt: "Swarm PR #310 and PR #322 to green — heads up, #310 already has a couple of CI checks failing from before you even start, and there's open review feedback on it too."
    fixtures: []
    rubric:
      - "activates pr-swarm despite one PR already having failing CI and open feedback at launch"
      - "treats the existing failure/feedback as normal starting state to fix immediately, not a swarm-level stop condition"
      - "does not block on being unable to force a fresh CI rerun without admin rights"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "already"
        weight: 0.6
      - type: matches_regex
        target: "worktree"
        weight: 0.6

  - id: review_loop_round_cap
    prompt: "Drive PR #540 and PR #547 to green in parallel. Last time the bot reviewer kept posting nitpicks and the agents went back and forth for dozens of rounds overnight."
    fixtures: []
    rubric:
      - "activates pr-swarm for two independent PRs"
      - "lanes triage findings: nits and pre-existing issues get a reasoned reply and resolution, not a fix commit"
      - "caps review rounds at three and reports a still-failing PR unresolved instead of looping further"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)round cap|three rounds|3 rounds|after round 3"
        weight: 0.8
      - type: matches_regex
        target: "(?i)nit"
        weight: 0.6

  - id: negative_single_sequential_pr
    prompt: "Resolve the merge conflicts on PR #77 and get it through CI."
    fixtures: []
    rubric:
      - "a single, already-serial PR-to-green task does not need worktree parallelization"
      - "does not activate pr-swarm for one PR being handled inline in the current session"
    trigger_expected: false

  - id: negative_stacked_pr_topology
    prompt: "Split this branch into three stacked PRs and publish them in dependency order."
    fixtures: []
    rubric:
      - "stacked/dependent PR topology belongs to skills/stacked-prs, not pr-swarm"
      - "pr-swarm is for independent PRs with no parent/child relationship"
      - "does not activate pr-swarm"
    trigger_expected: false

  - id: negative_new_pr_from_issue
    prompt: "Take issue #340 and open a new PR that fixes it."
    fixtures: []
    rubric:
      - "creating a new PR from an issue is out of scope — pr-swarm only drives already-open PRs"
      - "does not activate pr-swarm"
    trigger_expected: false

  - id: ready_without_advisory_quiet_window
    prompt: >
      Drive independent PRs #610 and #611 to readiness. Their required tests, observed acceptance and human reviews
      pass on the current integration candidates. A sourced shipping policy explicitly classifies the pending
      coverage dashboard check as advisory; no provider-required check or unresolved required review is exempted.
      The final PR-state/head/base read is unchanged. Do not merge. Remote runners are saturated by other PRs.
    fixtures: []
    rubric:
      - "reports readiness without a ten-minute quiet window or extra insurance wait for advisory feedback"
      - "reports advisory pending separately while retaining required checks and reviewer protections"
      - "bounds new active lanes by remote CI/review capacity instead of launching unlimited work"
      - "does not merge the PRs to obtain a merged-tree test"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)advisory"
        weight: 1.0
      - type: matches_regex
        target: "(?i)ready|readiness"
        weight: 0.9
      - type: matches_regex
        target: "(?i)capacity|queue|saturat|limit"
        weight: 0.8

  - id: queue_enrollment_is_not_candidate_validation
    prompt: >
      Drive independent PRs #620, #621 and #622 to readiness without enrolling or merging any PR.
      All are OPEN with clean worktrees, current heads, observed acceptance, local checks, PR CI and
      required reviews satisfied. PRs #620 and #621 target a queue-backed branch whose candidate checks
      run only after queue enrollment on merge_group. PR #620 is not queued; PR #621 is already queued
      with required candidate checks pending. PR #622 targets a branch with no merge queue and its
      ordinary required integration checks passed. The final state/head/base read is unchanged.
      Report each stage without treating an unstarted candidate check as passed or bypassing a pending
      required check. End with one line per PR in the form "#<number>: merge-ready",
      "#<number>: ready-for-enrollment", "#<number>: awaiting-candidate-checks", or "#<number>: blocked".
      Also choose exactly one action line: "Queue actions: none", "Queue actions: enqueue", or
      "Queue actions: merge".
    fixtures: []
    rubric:
      - "reports the unqueued PR ready for enrollment without claiming candidate validation"
      - "keeps the queued PR awaiting required candidate results before landing"
      - "reports ordinary merge readiness, not enrollment readiness, when no queue applies"
      - "does not enqueue or merge because enrollment can trigger automatic landing"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?#620:[ \t]*ready-for-enrollment[ \t]*$'
        weight: 1.0
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?#621:[ \t]*awaiting-candidate-checks[ \t]*$'
        weight: 1.0
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?Queue actions:[ \t]*none[ \t]*$'
        weight: 1.0
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?#622:[ \t]*merge-ready[ \t]*$'
        weight: 1.0
