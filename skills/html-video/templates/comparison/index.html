<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Side-by-side comparison</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <style id="html-video-fonts"><!-- Populated by fonts add; no fonts are bundled. --></style>
    <style>
      /* Timing lives in the data-start / data-duration attributes below.
         Motion is finite CSS keyframes: the renderer seeks them, never plays them.
         Only HTML elements are seeked; do not animate SVG child elements. */
      html, body { margin: 0; background: #0b1220; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0b1220; color: #f5f7fa; isolation: isolate;
        font-family: "HV Text", sans-serif;
      }
      .clip { position: absolute; margin: 0; }

      #heading { left: 160px; top: 80px; width: 1600px; font-size: 72px; line-height: 1.15; font-weight: 700; animation: rise 0.8s ease-out 0.1s both; }

      .panel { top: 230px; width: 760px; height: 620px; box-sizing: border-box; background: #121c31; border: 2px solid #2a3a5c; border-radius: 24px; }
      #panel-a { left: 160px; animation: from-left 0.9s ease-out 0.4s both; }
      #panel-b { left: 1000px; animation: from-right 0.9s ease-out 0.4s both; }

      .label { top: 262px; width: 680px; font-size: 52px; line-height: 1.2; font-weight: 700; }
      #label-a { left: 200px; color: #5ce1e6; animation: rise 0.7s ease-out 1.2s both; }
      #label-b { left: 1040px; color: #ffc857; animation: rise 0.7s ease-out 1.2s both; }

      .row { width: 680px; font-size: 40px; line-height: 1.3; }
      #a1, #b1 { top: 380px; }
      #a2, #b2 { top: 520px; }
      #a3, #b3 { top: 660px; }
      #a1, #a2, #a3 { left: 200px; }
      #b1, #b2, #b3 { left: 1040px; }
      .row { animation: rise 0.7s ease-out 0s both; }

      #verdict { left: 160px; top: 890px; width: 1600px; font-size: 48px; line-height: 1.2; font-weight: 700; text-align: center; animation: rise 0.8s ease-out 0.1s both; }

      #rail { left: 160px; top: 1030px; width: 1600px; height: 6px; background: #24324d; }
      #progress { left: 160px; top: 1030px; width: 1600px; height: 6px; background: #ffc857; transform-origin: left center; animation: grow 12s linear both; }

      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes from-left { from { opacity: 0; transform: translateX(-120px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes from-right { from { opacity: 0; transform: translateX(120px); } to { opacity: 1; transform: translateX(0); } }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080" data-no-timeline>
      <div id="rail" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
      <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>

      <h1 id="heading" class="clip" data-start="0" data-duration="12" data-track-index="2">Option A versus Option B</h1>

      <div id="panel-a" class="clip panel" data-start="0.2" data-duration="11.8" data-track-index="3"></div>
      <div id="panel-b" class="clip panel" data-start="0.2" data-duration="11.8" data-track-index="4"></div>

      <h2 id="label-a" class="clip label" data-start="0.2" data-duration="11.8" data-track-index="5">Option A</h2>
      <h2 id="label-b" class="clip label" data-start="0.2" data-duration="11.8" data-track-index="6">Option B</h2>

      <p id="a1" class="clip row" data-start="2.5" data-duration="9.5" data-track-index="7">First point about A</p>
      <p id="b1" class="clip row" data-start="2.5" data-duration="9.5" data-track-index="8">First point about B</p>
      <p id="a2" class="clip row" data-start="4.5" data-duration="7.5" data-track-index="9">Second point about A</p>
      <p id="b2" class="clip row" data-start="4.5" data-duration="7.5" data-track-index="10">Second point about B</p>
      <p id="a3" class="clip row" data-start="6.5" data-duration="5.5" data-track-index="11">Third point about A</p>
      <p id="b3" class="clip row" data-start="6.5" data-duration="5.5" data-track-index="12">Third point about B</p>

      <p id="verdict" class="clip" data-start="9" data-duration="3" data-track-index="13">The verdict in one sentence</p>
    </div>
  </body>
</html>
