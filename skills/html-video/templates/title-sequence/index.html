<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Title sequence</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <style id="html-video-fonts"><!-- Populated by fonts add; no fonts are bundled. --></style>
    <style>
      /* Timing lives in the data-start / data-duration attributes below.
         Motion is finite CSS keyframes: the renderer seeks them, never plays them.
         Only HTML elements are seeked; do not animate SVG child elements. */
      html, body { margin: 0; background: #0b1220; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0b1220; color: #f5f7fa; isolation: isolate;
        font-family: "HV Text", sans-serif;
      }
      .clip { position: absolute; margin: 0; left: 160px; width: 1600px; }

      .kicker { top: 330px; font-size: 36px; line-height: 1.2; letter-spacing: 0.2em; text-transform: uppercase; color: #ffc857; }
      .title { top: 410px; font-size: 128px; line-height: 1.1; font-weight: 700; }
      .statement { top: 370px; width: 1500px; font-size: 88px; line-height: 1.15; font-weight: 700; }
      .subtitle { top: 640px; font-size: 40px; line-height: 1.3; color: #b8c4da; }
      .closing { top: 380px; font-size: 104px; line-height: 1.1; font-weight: 700; }
      .credit { top: 600px; font-size: 36px; line-height: 1.3; color: #b8c4da; }

      #rail { top: 960px; height: 6px; background: #24324d; }
      #progress { top: 960px; height: 6px; background: #ffc857; transform-origin: left center; animation: grow 10s linear both; }

      #kicker { animation: rise 0.7s ease-out 0.1s both, leave 0.4s ease-in 3.1s forwards; }
      #title { animation: rise 0.9s ease-out 0.3s both, leave 0.4s ease-in 3.1s forwards; }
      #statement { animation: rise 0.9s ease-out 0.1s both, leave 0.4s ease-in 3.1s forwards; }
      #subtitle { animation: rise 0.8s ease-out 0.6s both, leave 0.4s ease-in 3.1s forwards; }
      #closing { animation: rise 0.9s ease-out 0.1s both; }
      #credit { animation: rise 0.8s ease-out 0.6s both; }

      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes leave { from { opacity: 1; } to { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080" data-no-timeline>
      <div id="rail" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="progress" class="clip" data-start="0" data-duration="10" data-track-index="1"></div>

      <!-- Beat 1: 0 to 3.5 s -->
      <p id="kicker" class="clip kicker" data-start="0" data-duration="3.5" data-track-index="2">A short kicker</p>
      <h1 id="title" class="clip title" data-start="0" data-duration="3.5" data-track-index="3">Your title goes here</h1>

      <!-- Beat 2: 3.5 to 7 s -->
      <h2 id="statement" class="clip statement" data-start="3.5" data-duration="3.5" data-track-index="4">One clear idea per beat</h2>
      <p id="subtitle" class="clip subtitle" data-start="3.5" data-duration="3.5" data-track-index="5">A supporting line that explains it</p>

      <!-- Beat 3: 7 to 10 s -->
      <h2 id="closing" class="clip closing" data-start="7" data-duration="3" data-track-index="6">A closing line</h2>
      <p id="credit" class="clip credit" data-start="7" data-duration="3" data-track-index="7">Name, role or source</p>
    </div>
  </body>
</html>
