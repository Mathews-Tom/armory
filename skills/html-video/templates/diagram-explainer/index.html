<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Diagram explainer</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <style id="html-video-fonts"><!-- Populated by fonts add; no fonts are bundled. --></style>
    <style>
      /* Timing lives in the data-start / data-duration attributes below.
         Motion is finite CSS keyframes: the renderer seeks them, never plays them.
         Only HTML elements are seeked, so nodes, connectors and arrowheads are
         plain HTML boxes; do not animate SVG child elements. */
      html, body { margin: 0; background: #0b1220; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0b1220; color: #f5f7fa; isolation: isolate;
        font-family: "HV Text", sans-serif;
      }
      .clip { position: absolute; margin: 0; }

      #heading { left: 160px; top: 90px; width: 1600px; font-size: 72px; line-height: 1.15; font-weight: 700; animation: rise 0.8s ease-out 0.1s both; }

      .node {
        top: 380px; width: 420px; height: 180px; box-sizing: border-box; display: grid; place-items: center;
        font-size: 56px; font-weight: 700; border-radius: 24px; border: 3px solid #5ce1e6; background: #121c31;
        animation: pop 0.7s ease-out 0s both;
      }
      #n1 { left: 160px; }
      #n2 { left: 750px; border-color: #ffc857; }
      #n3 { left: 1340px; border-color: #7ee787; }

      .link { top: 468px; height: 4px; background: #b8c4da; transform-origin: left center; animation: grow 0.6s ease-out 0s both; }
      #c1 { left: 596px; width: 118px; }
      #c2 { left: 1186px; width: 118px; }
      .head { top: 456px; width: 24px; height: 28px; background: #b8c4da; clip-path: polygon(0 0, 100% 50%, 0 100%); animation: fade 0.3s ease-out 0s both; }
      #h1 { left: 714px; }
      #h2 { left: 1304px; }

      .caption { top: 600px; width: 420px; font-size: 34px; line-height: 1.3; text-align: center; color: #b8c4da; animation: rise 0.7s ease-out 0s both; }
      #t1 { left: 160px; }
      #t2 { left: 750px; }
      #t3 { left: 1340px; }

      #summary { left: 160px; top: 800px; width: 1600px; font-size: 52px; line-height: 1.2; font-weight: 700; text-align: center; animation: rise 0.8s ease-out 0.1s both; }

      #rail { left: 160px; top: 1000px; width: 1600px; height: 6px; background: #24324d; }
      #progress { left: 160px; top: 1000px; width: 1600px; height: 6px; background: #ffc857; transform-origin: left center; animation: grow 14s linear both; }

      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080" data-no-timeline>
      <div id="rail" class="clip" data-start="0" data-duration="14" data-track-index="0"></div>
      <div id="progress" class="clip" data-start="0" data-duration="14" data-track-index="1"></div>

      <h1 id="heading" class="clip" data-start="0" data-duration="14" data-track-index="2">How the pipeline works</h1>

      <!-- Step 1 -->
      <div id="n1" class="clip node" data-start="1.5" data-duration="12.5" data-track-index="3">Input</div>
      <p id="t1" class="clip caption" data-start="2.3" data-duration="11.7" data-track-index="4">What goes in</p>

      <!-- Step 2 -->
      <div id="c1" class="clip link" data-start="3.6" data-duration="10.4" data-track-index="5"></div>
      <div id="h1" class="clip head" data-start="4.1" data-duration="9.9" data-track-index="6"></div>
      <div id="n2" class="clip node" data-start="4.5" data-duration="9.5" data-track-index="7">Process</div>
      <p id="t2" class="clip caption" data-start="5.3" data-duration="8.7" data-track-index="8">What changes it</p>

      <!-- Step 3 -->
      <div id="c2" class="clip link" data-start="6.6" data-duration="7.4" data-track-index="9"></div>
      <div id="h2" class="clip head" data-start="7.1" data-duration="6.9" data-track-index="10"></div>
      <div id="n3" class="clip node" data-start="7.5" data-duration="6.5" data-track-index="11">Output</div>
      <p id="t3" class="clip caption" data-start="8.3" data-duration="5.7" data-track-index="12">What comes out</p>

      <p id="summary" class="clip" data-start="10.5" data-duration="3.5" data-track-index="13">The takeaway in one sentence</p>
    </div>
  </body>
</html>
