cases:
  - id: routine_stack_shipping_with_local_replay_gates
    prompt: "Merge stack PRs 51 and 52 parent-first. Push and PR checks have the same display names. Validate every replayed commit before push, preserve our hooks, and retain protected or active worktrees."
    fixtures: []
    rubric:
      - "delegates explicit selected scope to ship-workflow with routine provider-backed assurance"
      - "uses --gates and per_commit true before push instead of temporary pre-push hook overrides"
      - "distinguishes current workflow/event/publisher/attempt evidence without renaming jobs"
      - "renews checks after promotion/retargeting and cleans only confirmed landed work"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "--stack-plan"
        weight: 1.0
      - type: matches_regex
        target: "--gates"
        weight: 1.0
      - type: matches_regex
        target: "per_commit"
        weight: 1.0
      - type: matches_regex
        target: "(protected|active|retain)"
        weight: 0.8

  - id: create_three_branch_stack
    prompt: "Create stacked PRs for feat/parser-core, feat/parser-cache, and feat/parser-cli based on main."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "publishes each branch against its parent branch"
      - "checks for dirty worktree before PR creation or push"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "gh pr create[\\s\\S]*--base"
        weight: 1.0
      - type: matches_regex
        target: "(feat/parser-core.*main|main.*feat/parser-core)"
        weight: 0.8
      - type: matches_regex
        target: "git status --porcelain"
        weight: 0.8

  - id: split_single_branch_stack
    prompt: "Split feat/parser-system into stacked PRs for core, cache, and CLI, then validate and publish the stack."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "inspects source branch relative to base"
      - "uses conservative split modes and verifies leaf equivalence before publishing"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "git log --oneline --reverse"
        weight: 0.8
      - type: matches_regex
        target: "(commit-range|commit-list|patch-guided|refuse)"
        weight: 1.0
      - type: matches_regex
        target: "git diff --exit-code"
        weight: 0.8

  - id: sync_stack_after_main_moves
    prompt: "Sync my PR stack after main moved and push the rebased stack safely."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "fetches current remote state without pruning before restacking"
      - "proves each replayed child against the three-way expected tree"
      - "pushes rewritten branches with an explicit expected-old lease, never a bare lease or --force"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "git fetch origin"
        weight: 0.6
      - type: matches_regex
        target: "git merge-tree --write-tree --merge-base"
        weight: 0.9
      - type: matches_regex
        target: "--force-with-lease=refs/heads/"
        weight: 1.0
      - type: not_contains
        target: "push --force origin"
        weight: 0.8

  - id: merge_stack_bottom_up
    prompt: "Merge the stack once checks pass, then clean up the branches."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "inspects topology, native membership and provenance, then authors one explicit stack decision packet"
      - "delegates parent-first landing, child promotion and retargeting, and cleanup once to the installed ship-workflow stack run"
      - "does not hand-run merges, retargets after landing or branch deletions"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "--stack-plan"
        weight: 1.0
      - type: matches_regex
        target: "ship-workflow"
        weight: 0.8
      - type: matches_regex
        target: "baseRefName"
        weight: 0.6
      - type: not_contains
        target: "gh pr merge"
        weight: 1.0
      - type: not_contains
        target: "git push origin --delete"
        weight: 1.0

  - id: retarget_existing_stack
    prompt: "Retarget the child PRs so each PR points at the correct parent branch in the stack."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "inspects existing provider PR bases"
      - "uses provider edit operation instead of recreating PRs"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "gh pr list"
        weight: 0.8
      - type: matches_regex
        target: "gh pr edit[\\s\\S]*--base"
        weight: 1.0

  - id: validate_stack_slices
    prompt: "Validate every slice in this stacked PR sequence and update the PR bodies with what ran."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "validates stack slices rather than only the leaf"
      - "records exact validation commands"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(validate|validation).*(branch|slice|stack)"
        weight: 0.8
      - type: matches_regex
        target: "(PR body|Validation)"
        weight: 0.8

  - id: create_stack_with_commit_trailers
    prompt: "Create stacked PRs for feat/parser-core, feat/parser-cache, and feat/parser-cli and preserve the stack identity in git history."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "mints or reads one canonical stack id"
      - "stamps every created stack commit with Stack-Id and Stack-Position trailers"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "Stack-Id"
        weight: 1.0
      - type: matches_regex
        target: "Stack-Position"
        weight: 1.0
      - type: matches_regex
        target: "(git interpret-trailers|git commit --amend --no-edit[\\s\\S]*--trailer)"
        weight: 1.0

  - id: recover_landed_stack_from_git_log
    prompt: "After this stack lands, show me how to recover every slice from git history by stack id."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "uses Stack-Id trailers as the durable identity"
      - "recovers stack commits with git log rather than provider metadata"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "git log --grep ['\"]Stack-Id:"
        weight: 1.0
      - type: matches_regex
        target: "trailers:key=Stack-Position"
        weight: 0.8

  - id: squash_only_merge_preserves_stack_id
    prompt: "Merge this stacked PR sequence in a repo that only allows squash merges without losing provenance."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "detects the repo's squash_merge_commit_message policy before choosing the merge method, not just whether squash is allowed"
      - "keeps squash under COMMIT_MESSAGES; under PR_BODY needs the trailers in the PR bodies of a stack it created; under BLANK makes losing them an explicit provenance decision"
      - "delegates the landing to the ship-workflow stack run, which never overrides the squash message"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "gh api repos/\\{owner\\}/\\{repo\\}"
        weight: 0.8
      - type: matches_regex
        target: "squash_merge_commit_message"
        weight: 1.0
      - type: matches_regex
        target: "(COMMIT_MESSAGES|PR_BODY|BLANK)"
        weight: 0.9
      - type: matches_regex
        target: "--stack-plan"
        weight: 0.8
      - type: not_contains
        target: "gh pr merge"
        weight: 1.0

  - id: backfill_existing_stack_trailers
    prompt: "Backfill Stack-Id trailers onto this local stack I created but haven't pushed yet, and prove the leaf tree still matches the original source branch."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "rewrites only unpublished stack commits the skill created"
      - "adds trailers without altering tree content"
      - "does not restamp commits that are already published or merged"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "git rebase[\\s\\S]*--exec[\\s\\S]*git commit --amend --no-edit[\\s\\S]*--trailer"
        weight: 1.0
      - type: matches_regex
        target: "git diff --exit-code"
        weight: 0.8

  - id: stack_id_mismatch_stops_mutation
    prompt: "Validate this stack before merge; one commit has a Stack-Id trailer that differs from .stack-prs.yaml."
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "compares commit trailers against the canonical .stack-prs.yaml stack_id"
      - "stops mutation when the ids differ"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "Stack-Id"
        weight: 0.8
      - type: matches_regex
        target: "\\.stack-prs\\.yaml"
        weight: 0.8
      - type: matches_regex
        target: "(stop|stops|do not|must not)[\\s\\S]*(mismatch|differs|different)"
        weight: 1.0

  - id: github_native_same_repo_stack
    prompt: >
      Link same-repository branches feat/core, feat/api, and feat/ui into a
      GitHub-native stack on main. Preserve the existing Stack-Id trailers and
      stop if native topology disagrees with the Armory stack metadata.
    fixtures: []
    rubric:
      - "probes gh stack support and same-repository eligibility"
      - "links the stack bottom-to-top with gh stack link"
      - "preserves Armory provenance and fails on topology disagreement"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "gh stack --help"
        weight: 0.8
      - type: matches_regex
        target: "gh stack link[\\s\\S]*--base[\\s\\S]*main"
        weight: 1.0
      - type: matches_regex
        target: "(Stack-Id|Stack-Position|\\.stack-prs\\.yaml)"
        weight: 0.9
      - type: matches_regex
        target: "(same.repository|fork|topology|disagree|mismatch)"
        weight: 0.9

  - id: github_native_prefix_merge
    prompt: >
      In a GitHub-native stack whose base has no merge queue, merge only the
      prefix through PR #42 with a merge commit after every displayed layer is
      green. Do not infer the merge boundary.
    fixtures: []
    rubric:
      - "requires the explicit highest PR number for a partial merge and selects every open member up to #42"
      - "authors a stack decision packet with the trailer-preserving merge method and delegates it to the ship-workflow stack run, which sends one guarded direct-merge request on #42"
      - "does not claim the prefix lands atomically or that the guard covers lower heads, and re-inspects the remaining topology afterwards"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "--stack-plan"
        weight: 1.0
      - type: matches_regex
        target: "\"merge_method\":\\s*\"merge\""
        weight: 0.9
      - type: matches_regex
        target: "(topology|re-inspect|retained)"
        weight: 0.6
      - type: not_contains
        target: "gh stack merge"
        weight: 1.0
      - type: not_contains
        target: "gh pr merge 42"
        weight: 0.9
      - type: not_contains
        target: "gh api --method PUT"
        weight: 0.9

  - id: github_native_prefix_merge_squash
    prompt: >
      In a GitHub-native stack whose repo defaults squash_merge_commit_message
      to COMMIT_MESSAGES and whose base has no merge queue, merge only the
      prefix through PR #42 with a squash after every displayed layer is green.
    fixtures: []
    rubric:
      - "checks squash_merge_commit_message before choosing squash as the merge method"
      - "expects trailers to survive automatically under COMMIT_MESSAGES with no squash-body workaround"
      - "decides merge_method squash in the stack decision packet and delegates one direct request on #42 with no commit_title or commit_message override"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "\"merge_method\":\\s*\"squash\""
        weight: 1.0
      - type: matches_regex
        target: "--stack-plan"
        weight: 0.8
      - type: matches_regex
        target: "squash_merge_commit_message"
        weight: 0.9
      - type: matches_regex
        target: "(COMMIT_MESSAGES)[\\s\\S]*(automatic|survive)"
        weight: 0.8
      - type: not_contains
        target: "gh stack merge"
        weight: 0.9

  - id: github_native_fork_fallback
    prompt: >
      Use GitHub-native stack mode for a stack whose child branch belongs to a
      fork. Keep the stack safe.
    fixtures: []
    rubric:
      - "rejects GitHub-native mode for cross-fork stacks"
      - "keeps the stack manual without losing provenance"
      - "leaves any later landing to the delegated stack decision packet rather than hand-run merges"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(fork|cross.repository|same.repository)"
        weight: 0.9
      - type: matches_regex
        target: "manual"
        weight: 0.9
      - type: matches_regex
        target: "(Stack-Id|Stack-Position|provenance)"
        weight: 0.8
      - type: not_contains
        target: "gh stack link"
        weight: 1.0
      - type: not_contains
        target: "gh stack merge"
        weight: 1.0
      - type: not_contains
        target: "gh pr merge"
        weight: 0.9

  - id: github_native_unavailable_fallback
    prompt: >
      GitHub native stacked pull requests are disabled for this repository.
      Keep a same-repository stack safe and continue without native mode.
    fixtures: []
    rubric:
      - "detects native mode unavailability and selects manual Armory mode"
      - "does not run native link or merge operations"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(exit code 9|not enabled|native.*unavailable|manual.*fallback)"
        weight: 1.0
      - type: not_contains
        target: "gh stack link"
        weight: 1.0
      - type: not_contains
        target: "gh stack merge"
        weight: 1.0

  - id: github_native_detection_forces_native_merge
    prompt: >
      Merge this stack. The Inspect probe already found that PR #193 reports a
      non-null native stack.
    fixtures: []
    rubric:
      - "treats a detected native stack as mandatory, not opt-in"
      - "requires an explicitly selected highest PR instead of inferring the prefix"
      - "delegates the selected prefix to the ship-workflow stack run's single guarded async request"
      - "does not offer the manual gh pr merge path as an alternative"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "--stack-plan"
        weight: 1.0
      - type: matches_regex
        target: "(highest|explicit)[\\s\\S]*(PR|pull request|prefix)"
        weight: 0.8
      - type: not_contains
        target: "gh pr merge 193"
        weight: 0.9
      - type: not_contains
        target: "gh stack merge"
        weight: 0.9
      - type: matches_regex
        target: "(mandatory|must|no opt-in|not a choice)"
        weight: 0.8

  - id: native_stack_guarded_async_prefix_merge
    prompt: >
      PRs #57 and #58 are the bottom two members of a four-PR GitHub-native
      stack whose base, main, uses a merge queue. Merge exactly the prefix
      through #58 and keep #59 and #60 open. Tell me what to do if the merge
      request's response is lost.
    fixtures: []
    rubric:
      - "selects exactly #57 and #58 in the stack decision packet, lists #59 and #60 as unselected nodes and refuses to widen the prefix"
      - "delegates to the ship-workflow stack run, which sends one queue request on #58 guarded only by #58's inspected head and sends no merge method"
      - "on a lost response resumes the same run so the outcome is reconciled from pull request facts, never resending the request"
      - "treats enqueued as not landed and relies on per-member landing proofs plus verification of retained #59 and #60 trees and own slices, keeping #60 on #59"
      - "never falls back to gh pr merge, per-member merges or a hand-run merge-async request"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "--stack-plan"
        weight: 1.0
      - type: matches_regex
        target: "\"select\":\\s*false"
        weight: 0.8
      - type: matches_regex
        target: "--resume"
        weight: 0.8
      - type: matches_regex
        target: "(never|do not|don't|no)[\\s\\S]{0,60}(retry|resend|re-send|send[\\s\\S]{0,20}again)"
        weight: 0.9
      - type: matches_regex
        target: "enqueued[\\s\\S]{0,120}(not|never)[\\s\\S]{0,40}(merged|landed)"
        weight: 0.9
      - type: matches_regex
        target: "#59[\\s\\S]*(tree|slice|retained|unselected)"
        weight: 0.8
      - type: not_contains
        target: "gh pr merge"
        weight: 1.0
      - type: not_contains
        target: "gh api --method PUT"
        weight: 1.0
      - type: not_contains
        target: "gh stack merge"
        weight: 1.0

  - id: native_stack_detected_during_inspect
    prompt: >
      Inspect this two-PR stack before planning anything else.
    fixtures: []
    rubric:
      - "probes native stack membership for every open stack PR during Inspect"
      - "uses a non-mutating provider check rather than gh stack view"
      - "records native status in the stack model output"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "gh api repos/\\{owner\\}/\\{repo\\}/pulls/"
        weight: 1.0
      - type: matches_regex
        target: "\\.stack"
        weight: 0.8
      - type: not_contains
        target: "gh stack view <"
        weight: 0.8

  - id: squash_merged_local_branch_cleanup
    prompt: >
      The stack merged with --squash and git branch --merged origin/staging
      lists nothing for the stack branches. Clean up the local branches.
    fixtures: []
    rubric:
      - "recognizes ancestry cannot prove a squash or rebase landing, and that git cherry or a quiet diff is not deletion proof either"
      - "delegates cleanup-only to the ship-workflow stack run, selecting only nodes the provider reports merged"
      - "relies on the run's recorded landed-head proof and expected-OID deletions, retaining any branch that fails it"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "--stack-plan"
        weight: 1.0
      - type: matches_regex
        target: "(squash|rebase)[\\s\\S]*(ancestry|no ancestry|not list)"
        weight: 0.8
      - type: not_contains
        target: "git branch -D"
        weight: 1.0
      - type: not_contains
        target: "git push origin --delete"
        weight: 1.0

  - id: stack_base_is_not_main
    prompt: >
      Merge this stack. Both PRs target staging, not main.
    fixtures: []
    rubric:
      - "resolves the base branch from the root PR's baseRefName instead of assuming main"
      - "uses the resolved base as the stack decision packet's trunk for the delegated landing"
      - "never hardcodes main when the stack's actual base is staging"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "baseRefName"
        weight: 0.9
      - type: matches_regex
        target: "\"trunk\":\\s*\"staging\""
        weight: 0.9
      - type: not_contains
        target: "--base main"
        weight: 1.0
      - type: not_contains
        target: "origin/main"
        weight: 1.0

  - id: landing_without_ship_workflow_blocks
    prompt: >
      Merge PRs #21 and #22 of this manual stack. The ship-workflow skill is not
      installed in this client.
    fixtures: []
    rubric:
      - "activates stacked-prs"
      - "stops BLOCKED naming the missing ship-workflow package for the landing"
      - "does not fall back to hand-run merges, retargets or branch deletions"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "BLOCKED"
        weight: 1.0
      - type: matches_regex
        target: "ship-workflow"
        weight: 1.0
      - type: not_contains
        target: "gh pr merge"
        weight: 1.0
      - type: not_contains
        target: "git push origin --delete"
        weight: 0.9

  - id: negative_single_pr
    prompt: "Open a normal PR for my current branch against main."
    fixtures: []
    rubric:
      - "normal one-branch PR creation belongs to the standard PR workflow"
      - "does not activate stacked-prs"
    trigger_expected: false

  - id: negative_git_rebase_tutorial
    prompt: "Explain how Git rebase works with a simple example."
    fixtures: []
    rubric:
      - "general Git education is not a stacked PR workflow"
      - "does not activate stacked-prs"
    trigger_expected: false
