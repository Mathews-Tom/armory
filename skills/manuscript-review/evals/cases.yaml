cases:
  - id: pre_submission_review
    prompt: "Review my paper before I submit it to the conference"
    fixtures: []
    rubric:
      - "produces section-level diagnostics with specific feedback"
      - "checks citation hygiene (formatting, completeness, consistency)"
      - "assesses overall submission readiness"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)executive summary|quality assessment"
        weight: 1.0
      - type: matches_regex
        target: "HIGH|MEDIUM|LOW"
        weight: 0.8
      - type: matches_regex
        target: "(?i)publication.ready|recommend revisions|needs work"
        weight: 0.8
      - type: matches_regex
        target: "(?i)citation|reference"
        weight: 0.6
      - type: matches_regex
        target: "(?i)priority|checklist"
        weight: 0.6

  - id: reference_consistency_check
    prompt: "Check the references in my thesis chapter for consistency"
    fixtures: []
    rubric:
      - "identifies citation format issues across references"
      - "checks for missing or duplicate references"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)citation|reference"
        weight: 1.0
      - type: matches_regex
        target: "HIGH|MEDIUM|LOW"
        weight: 0.8
      - type: matches_regex
        target: "(?i)consistency|format|style"
        weight: 0.6
      - type: matches_regex
        target: "(?i)missing|duplicate|orphan"
        weight: 0.6

  - id: numbers_from_code
    prompt: "Verify that the numbers in my paper come from code"
    fixtures: []
    rubric:
      - "numerical provenance verification is manuscript-provenance territory, not manuscript review"
    trigger_expected: false

  - id: write_introduction
    prompt: "Write the introduction section for my paper"
    fixtures: []
    rubric:
      - "writing new manuscript content is outside review scope"
    trigger_expected: false

  - id: preserve_signed_citation_link
    prompt: "Review this manuscript excerpt before submission. The evidence URL is signed; preserve it exactly in any suggested edit: 'The experiment reports p95 of 25 ms [1]. [1] https://example.org/results?utm_source=chatgpt.com&sig=abc123'"
    fixtures: []
    rubric:
      - "Keeps the citation target, including tracking and signature parameters, unchanged"
      - "Reviews the excerpt without treating URL normalization as prose cleanup or claiming verified factual accuracy"
    trigger_expected: true
    assertions:
      - type: contains
        target: "https://example.org/results?utm_source=chatgpt.com&sig=abc123"
      - type: matches_regex
        target: "25\\s*ms"
