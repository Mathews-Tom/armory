cases:
  - id: sequential_milestone_execution
    prompt: >
      Run the milestone prompts in .docs/EXECUTION_PROMPTS.md one after another. For each milestone, after the stack reports GO and external gates pass, merge the stack root-to-leaf and clean merged branches before continuing.
    fixtures: []
    rubric:
      - "parses EXECUTION_PROMPTS.md and identifies milestone /goal blocks"
      - "runs dependent milestones sequentially rather than launching the whole file blindly"
      - "uses external gates such as PR state, CI, verification commands, and review status before advancing"
      - "merges automatically only after a GO verdict and external gates clear, then cleans verified merged branches"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(EXECUTION_PROMPTS\\.md|/goal|milestone)"
        weight: 0.8
      - type: matches_regex
        target: "(sequential|one after another|dependency|Depends on)"
        weight: 0.8
      - type: matches_regex
        target: "(CI|checks|verification|PR state|review)"
        weight: 0.8
      - type: matches_regex
        target: "(merge|root-to-leaf|GO|NO-GO|cleanup|merged branches)"
        weight: 0.7

  - id: parallel_independent_milestones
    prompt: >
      The plan has M2 and M3 with no dependency between them. Run the independent milestone prompts in parallel, but keep the runs isolated and stop the sequence if either one fails.
    fixtures: []
    rubric:
      - "detects independent milestones from the dependency graph"
      - "uses isolated worktrees or sessions for concurrent runs"
      - "halts downstream work if any parallel lane fails"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(independent|parallel|wave|dependency graph|DAG)"
        weight: 0.8
      - type: matches_regex
        target: "(worktree|isolated|separate session|profile)"
        weight: 0.8
      - type: matches_regex
        target: "(fail|halt|stop|downstream)"
        weight: 0.7

  - id: merge_stack_and_cleanup
    prompt: >
      Let's merge the stack for the current milestone. Ensure CI is green for each PR. Once done, clean up all local and remote merged branches.
    fixtures: []
    rubric:
      - "routes merge-and-clean workflow through stacked PR discipline"
      - "requires green CI/checks before each merge"
      - "treats explicit merge request as equivalent to a GO merge decision when gates are green"
      - "cleans only branches verified as merged"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(merge root|root-to-leaf|stacked-prs|stack order)"
        weight: 0.8
      - type: matches_regex
        target: "(CI|checks|green)"
        weight: 0.8
      - type: matches_regex
        target: "(clean|cleanup|local.*remote|merged branches)"
        weight: 0.7

  - id: shared_release_train_preparation
    prompt: >
      M1 and M2 both target release v2.4.0. M1 is merged, but M2 is still open; do not update release artifacts yet.
      After M2 merges, prepare the release using the repository's VERSION file and CHANGELOG.md, create a reviewed green
      release-preparation PR, and do not tag or publish because the plan does not require it.
    fixtures: []
    rubric:
      - "defers release preparation while M2 remains unmerged"
      - "recomputes release-train completion from external merge state"
      - "hands the cited v2.4.0 target, VERSION and CHANGELOG.md artifacts, and named base to release-captain only after the train completes"
      - "has release-captain edit and verify VERSION and CHANGELOG.md and publish them through ship-workflow only until the PR exists"
      - "requires the release-preparation PR to be reviewed, green, and externally merged, then runs post-merge release verification"
      - "does not tag or publish without an explicit release-train requirement"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(release train|v2\\.4\\.0|M1|M2)"
        weight: 1.0
      - type: matches_regex
        target: "(unmerged|incomplete|defer|Continue within release train)"
        weight: 0.9
      - type: matches_regex
        target: "(release-captain|release preparation|release-preparation PR)"
        weight: 0.9
      - type: matches_regex
        target: "(VERSION|CHANGELOG\\.md)"
        weight: 0.9
      - type: matches_regex
        target: "(do not tag|do not publish|not.*publish)"
        weight: 0.8

  - id: open_release_pr_is_not_release_completion
    prompt: >
      Release train v2.6.0 is complete. release-captain updated pyproject.toml and CHANGELOG.md and its
      ship-workflow run returned COMPLETE at endpoint pr with release PR #88 open and CI pending. Record the
      release as done and start the next milestone that depends on v2.6.0.
    fixtures: []
    rubric:
      - "treats the open release PR as prepared, not as a completed or merged release"
      - "keeps v2.6.0 release preparation pending until PR #88 is reviewed, green, and externally merged and post-merge verification passes"
      - "does not merge PR #88 or advance the dependent milestone as a side effect of the PR-only run"
      - "does not tag or publish"
      - "reports ordered NEXT STEPS naming the pending release gate"
    trigger_expected: true

  - id: failed_release_preparation_isolation
    prompt: >
      Release v2.4.0 has completed its train, but its release-preparation PR fails CI. Preserve that branch and PR for remediation,
      stop v2.4.0 and only milestones whose declared dependency closure includes it, and continue the independent v2.5.0 train
      in an isolated lane. Do not tag or publish either release without an explicit requirement.
    fixtures: []
    rubric:
      - "marks v2.4.0 release preparation as NO-GO and preserves its branch and PR"
      - "stops only the affected train and declared dependency-closure consumers"
      - "permits the independent v2.5.0 train to continue in an isolated lane"
      - "does not tag or publish without an explicit train requirement"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(v2\\.4\\.0|release preparation).*(NO-GO|fail|failed|pending)"
        weight: 1.0
      - type: matches_regex
        target: "(leave.*branch.*PR|preserve.*branch.*PR|intact for remediation)"
        weight: 0.9
      - type: matches_regex
        target: "(dependency closure|affected train|independent.*v2\\.5\\.0|isolated lane)"
        weight: 0.9
      - type: matches_regex
        target: "(do not tag|do not publish|not.*publish)"
        weight: 0.8

  - id: direct_package_fix_over_control_plane
    prompt: >
      The package evaluator found that skills/example has an observable trigger
      regression and its existing eval can verify a focused description fix.
      The release target is unresolved. Fix the package rather than starting a
      new benchmark, telemetry pipeline, or release-control project.
    fixtures: []
    rubric:
      - "prioritizes the focused package correction and its existing evaluator"
      - "treats the unresolved release target as release-preparation work, not a package-fix blocker"
      - "does not create benchmark, telemetry, dispatcher, dashboard, or control-plane work"
      - "reports the smallest observable next action"
    trigger_expected: true
    assertions:
      - type: contains
        target: "NEXT STEPS"
        weight: 1.0
      - type: matches_regex
        target: "(package|skills/example).*(fix|correct|improve)|(fix|correct|improve).*(package|skills/example)"
        weight: 1.0
      - type: matches_regex
        target: "(existing eval|evaluator|focused).*verif"
        weight: 0.9
      - type: matches_regex
        target: "(before|rather than|instead of|prioriti[sz]e)[^\\n]{0,80}(benchmark|telemetry|dispatcher|dashboard|control.plane|infrastructure)"
        weight: 1.0
      - type: matches_regex
        target: "(release target|release preparation).*(defer|does not block|not a blocker)|(defer|does not block|not a blocker).*(release target|release preparation)"
        weight: 0.9

  - id: negative_generate_plan_prompts
    prompt: >
      Create DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md from the documents in docs/ and save them in .docs.
    fixtures: []
    rubric:
      - "generating plan and prompt files is plan-prompts territory"
    trigger_expected: false

  - id: negative_single_stack_repair
    prompt: >
      This existing stacked PR chain has the wrong base on PR #42. Fix the branch topology and retarget the child PR.
    fixtures: []
    rubric:
      - "repairing one existing stack is stacked-prs territory, not milestone orchestration"
    trigger_expected: false

  - id: design_reconciliation_before_parallel_wave
    prompt: >
      M5 and M6 are currently independent and ready for a parallel implementation wave. Before
      launch, M5's design gate finds that a shared authentication assumption invalidates both
      milestones. Reconcile the plan and prompts, preserve the gitignored local history, and
      only then decide whether either implementation lane may run.
    fixtures: []
    rubric:
      - "serializes design reconciliation before launching or continuing parallel implementation"
      - "updates the current and every affected downstream milestone, then rebuilds the DAG and waves"
      - "requires a reviewed green merged docs-only reconciliation PR before dependent code PRs"
      - "preserves one canonical ignored history ledger without concurrent writes"
      - "halts every affected implementation lane and rejects continued scaffolding or partial code work"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(design gate|design reconciliation|DESIGN GO|DESIGN NO-GO)"
        weight: 1.0
      - type: matches_regex
        target: "(serial|sequential|before.*parallel|rebuild.*DAG|reload.*plan)"
        weight: 0.9
      - type: matches_regex
        target: "(docs-only|reconciliation.*PR|reviewed.*green)"
        weight: 0.9
      - type: matches_regex
        target: "(history.*canonical|single.*history|concurrent.*write)"
        weight: 0.8
      - type: matches_regex
        target: "(halt all|stop all|no.*scaffolding|do not.*continue.*code)"
        weight: 0.9

  - id: missing_ignored_history_reconstruction
    prompt: >
      Start M5 in a fresh worktree where the gitignored
      .docs/DEVELOPMENT_PLAN_HISTORY.md is absent. The committed plan and prompts, merged
      predecessor PRs, CI evidence, and current codebase are available. Reconstruct the required
      design context and decide whether implementation may begin.
    fixtures: []
    rubric:
      - "does not treat a missing ignored ledger as authoritative plan loss"
      - "reconstructs design evidence from committed artifacts, merged predecessors, CI, and current code"
      - "restores the local ledger after evidence is verified"
      - "blocks implementation when reconciliation finds plan drift"
    trigger_expected: true
    assertions:
      - type: contains
        target: ".docs/DEVELOPMENT_PLAN_HISTORY.md"
        weight: 1.0
      - type: matches_regex
        target: "(merged PR|CI|current codebase|committed plan)"
        weight: 0.9
      - type: matches_regex
        target: "(reconstruct|restore|regenerate)"
        weight: 0.8
      - type: matches_regex
        target: "(block|DESIGN NO-GO|drift)"
        weight: 0.8

  - id: isolated_lane_execution_and_verification
    prompt: >
      M7 and M8 are independent and ready. Gather each design gate's evidence without filling this
      session with predecessor diffs and CI logs, run both implementations concurrently, and confirm
      the merge gates without trusting either lane's own completion report.
    fixtures: []
    rubric:
      - "collects design-gate evidence in dedicated read-only subagents while keeping verdicts and ledger appends serialized in the canonical session"
      - "launches each implementation as an independent session in its own worktree with absolute paths"
      - "verifies merge gates through a context that did not implement the milestone"
      - "requires cited evidence rather than a lane's self-reported success"
      - "keeps merge, rebase, retarget, cleanup, and release commands in the canonical session"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(subagent|isolated lane|evidence lane)"
        weight: 1.0
      - type: matches_regex
        target: "(worktree|independent session|claude -p)"
        weight: 0.9
      - type: matches_regex
        target: "(serial|canonical session|one writer|single writer)"
        weight: 0.9
      - type: matches_regex
        target: "(did not implement|independent verification|not.*self-report|unverified)"
        weight: 1.0
      - type: matches_regex
        target: "(cited evidence|citation|exact output|check conclusion)"
        weight: 0.8

  - id: overlapping_parallel_milestones
    prompt: >
      M5 and M6 have no dependency edge and both report DESIGN GO, but their reconciled plans
      modify the same authentication files. Run them in parallel anyway unless an explicit
      exception is required.
    fixtures: []
    rubric:
      - "detects file overlap after reconciliation before launching the implementation wave"
      - "runs overlapping milestones sequentially unless the user explicitly accepts conflict risk"
      - "does not treat dependency independence as sufficient parallel-safety evidence"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(overlap|same files|shared files|file conflict)"
        weight: 0.9
      - type: matches_regex
        target: "(sequential|serialize|one at a time)"
        weight: 0.9
      - type: matches_regex
        target: "(explicit.*accept|user.*accept|conflict risk)"
        weight: 0.8

  - id: terminal_next_steps_handoff
    prompt: >
      M4 is NO-GO because migration verification fails. M5 shares M4's v3.1.0 release train and
      depends on M4. M6 is dependency-independent and targets v3.2.0. Report the required
      terminal next steps without tagging or publishing.
    fixtures: []
    rubric:
      - "reports an ordered NEXT STEPS handoff after the NO-GO verdict"
      - "names migration remediation and a retry gate"
      - "blocks dependent M5 and v3.1.0 release preparation"
      - "permits only independent M6 to proceed and explicitly identifies the skip"
      - "does not tag or publish"
    trigger_expected: true
    assertions:
      - type: contains
        target: "NEXT STEPS"
        weight: 1.0
      - type: matches_regex
        target: "(migration|verification).*(remediat|retry|fix)|(remediat|retry|fix).*(migration|verification)"
        weight: 0.9
      - type: matches_regex
        target: "(M5|dependent|blocked)"
        weight: 0.9
      - type: matches_regex
        target: "(M6|independent|SKIP.*RUN)"
        weight: 0.9
      - type: matches_regex
        target: "(release preparation|RELEASE PREP|deferred|blocked)"
        weight: 0.8
      - type: matches_regex
        target: "(do not tag|do not publish|not.*publish)"
        weight: 0.8

  - id: opt_in_canonical_per_pr_issue_tracking
    prompt: >
      Run M3 with ISSUE_TRACKING=on in its prompt and two planned PRs. The current
      design gate is GO. This is a resume: one issue already has the stable marker
      for PR-1, but that issue is closed and no mapped PR has merged into its intended
      base. Matching work-type labels exist. PR-2 will target PR-1's non-default stack
      branch. Ensure each PR has its own tracking issue before its branch, without
      duplicates or private plan content. Explain later design NO-GO, retargeting,
      and merge outcomes, and how completed closed matches differ from pending work.
    fixtures: []
    rubric:
      - "keeps tracking opt-in and default-off; only the canonical runner mutates issues"
      - "searches open and closed issues by exact stable marker, reopens PR-1's pending closed match with one public-safe comment, and creates only PR-2's missing issue; a completed closed match is reused without reopening"
      - "creates or reuses one issue per planned PR after DESIGN GO and before its branch"
      - "applies existing matching labels without creating labels; requires Tracks linkage in every PR body and Closes when default-targeting, with canonical closure after default-branch integration and verified acceptance"
      - "comments public-safe design NO-GO and observed PR merge outcomes idempotently"
      - "excludes private plan content, local paths, and ignored-file references from titles, bodies, and comments"
      - "passes issue mappings to lanes without authorizing them to create or edit issues"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)(default[^\\n]*off|off[^\\n]*default)"
        weight: 0.8
      - type: matches_regex
        target: "(?i)canonical[^\\n]*(issue|mutat)|(issue|mutat)[^\\n]*canonical"
        weight: 1.0
      - type: matches_regex
        target: "(?is)(?:(open.*closed|closed.*open).*marker|marker.*(open.*closed|closed.*open))"
        weight: 1.0
      - type: matches_regex
        target: "(?i)reus[^\\n]*(PR-1|existing|match)"
        weight: 1.0
      - type: matches_regex
        target: "(?is)DESIGN GO.*(create|reuse).*before[^\\n]*branch"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(each|per|one)[^\\n]*(planned PR|PR.*issue|issue.*PR)"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(existing|matching)[^\\n]*label"
        weight: 0.8
      - type: matches_regex
        target: "Closes #"
        weight: 1.0
      - type: matches_regex
        target: "(?is)(comment.*NO-GO|NO-GO.*comment)"
        weight: 0.9
      - type: matches_regex
        target: "(?is)(comment.*merge|merge.*comment)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)(public.safe|private plan|local paths|ignored.file)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)(lane|subagent)[^\\n]*(never|not|no)[^\\n]*(creat|edit|mutat)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)reopen[^\\n]*PR-1|PR-1[^\\n]*reopen"
        weight: 1.0
      - type: matches_regex
        target: "Tracks #"
        weight: 1.0
      - type: matches_regex
        target: "(?is)default.branch.*acceptance|acceptance.*default.branch"
        weight: 1.0

  - id: tracking_absent_or_off_has_no_issue_mutations
    prompt: >
      Run independent M2 and M3 sequentially. M2 has no ISSUE_TRACKING setting;
      M3 explicitly has ISSUE_TRACKING=off. No user override enables tracking.
      Report only actions you will execute, without examples of disabled commands.
    fixtures: []
    rubric:
      - "performs no issue creation, editing, labeling, closure, or comments for either milestone"
      - "continues normal design and implementation gates without adding issue prerequisites"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)(no|zero)[^\\n]*issue[^\\n]*mutat|issue tracking[^\\n]*off"
        weight: 1.0
      - type: not_contains
        target: "gh issue create"
        weight: 1.0
      - type: not_contains
        target: "gh issue edit"
        weight: 1.0
      - type: not_contains
        target: "gh issue comment"
        weight: 1.0
      - type: not_contains
        target: "gh issue close"
        weight: 1.0

  - id: tracking_uncertain_create_and_marker_conflict
    prompt: >
      M4 has tracking enabled and current DESIGN GO. Creating PR-1's issue timed
      out without a definitive response. A subsequent complete lookup finds one
      exact marker match. The repository has no matching labels. PR-2's lookup
      returns two issues with its exact marker. Give the next actions for each
      PR and whether either branch may be created.
    fixtures: []
    rubric:
      - "repeats complete paginated open and closed exact-marker lookup before retrying an uncertain create"
      - "reuses PR-1's single match without issuing another create and leaves it unlabeled"
      - "blocks PR-2 before branching because duplicate markers require canonical resolution"
      - "does not create labels or silently turn tracking off"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?is)(uncertain|timed out|timeout).*look.?up.*(open.*closed|closed.*open)"
        weight: 1.0
      - type: matches_regex
        target: "(?i)PR-1[^\\n]*reus|reus[^\\n]*PR-1"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(unlabeled|without[^\\n]*label)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)PR-2[^\\n]*(block|stop)|(?:block|stop)[^\\n]*PR-2"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(duplicate|two|multiple)[^\\n]*marker"
        weight: 1.0
      - type: not_contains
        target: "gh label create"
        weight: 1.0

  - id: tracking_revision_sync_and_reproducible_keys
    prompt: >
      Tracking is enabled by user override on an old M5 prompt without issue keys.
      Its repository, milestone title and ID, ordered PR positions, and first planned
      commit subjects are authoritative. The ignored ledger is missing. Design
      reconciliation is required for a second time after the first reconciliation
      PR merged, and a closed reconcile-1 issue exists in repository history. The
      revised plan removes one product PR, reorders surviving PRs, and changes a
      surviving PR's first commit subject and acceptance. Explain issue actions
      now and after PLAN REVISION none, including a lane that later needs an extra PR.
    fixtures: []
    rubric:
      - "creates only the second ordinal reconciliation issue now and defers product-PR issues until the no-revision gate"
      - "derives fallback keys only when no keys are present, deterministically from pre-revision authoritative content; reconciliation writes in-use plan/milestone/PR keys into revised issue slots and preserves surviving work's keys rather than recomputing them by the new positions or subjects"
      - "rewrites reused issue titles/bodies preserving markers and comments/closes removed-key issues as superseded"
      - "tells lanes that the runner owns the milestone, they are not the canonical owner, they must use the provided mapping, and they may not create/edit/comment/label/close issues; they stop/report extra PRs before branching"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)reconcile-2"
        weight: 1.0
      - type: matches_regex
        target: "(?is)(defer|only after)[^\\n]*product.*PLAN REVISION[^\\n]*none"
        weight: 1.0
      - type: matches_regex
        target: "(?is)(deterministic|SHA-?256).*(repository|owner/name).*(title).*(position).*(commit subject)"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(rewrit|updat)[^\\n]*(title|body)"
        weight: 1.0
      - type: matches_regex
        target: "(?is)comment.*clos.*superseded"
        weight: 1.0
      - type: matches_regex
        target: "(?is)(extra|another) PR.*stop.*report.*before[^\\n]*branch"
        weight: 1.0
      - type: matches_regex
        target: "(?is)(writ|persist)[^\\n]*(key|identit)[^\\n]*(prompt|slot)|(?:prompt|slot)[^\\n]*(persist|in.use)[^\\n]*key"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(preserv|retain)[^\\n]*(surviv|key)|surviv[^\\n]*(preserv|retain)"
        weight: 1.0
      - type: matches_regex
        target: "(?i)(lane|you)[^\\n]*not[^\\n]*canonical owner"
        weight: 1.0
