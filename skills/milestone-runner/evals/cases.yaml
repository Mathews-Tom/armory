cases:
  - id: sequential_milestone_execution
    prompt: >
      Run the milestone prompts in .docs/EXECUTION_PROMPTS.md one after another. For each milestone, after the stack reports GO and external gates pass, merge the stack root-to-leaf and clean merged branches before continuing.
    fixtures: []
    rubric:
      - "restates each milestone's GOAL, NON-GOALS and DONE WHEN from the plan before work"
      - "runs dependent milestones sequentially after a design check"
      - "uses external gates such as PR state, CI, verification commands and review before advancing"
      - "merges root-to-leaf only after gates clear, then cleans verified merged branches"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(EXECUTION_PROMPTS\\.md|/goal|milestone)"
        weight: 0.8
      - type: matches_regex
        target: "(DESIGN GO|design check)"
        weight: 0.8
      - type: matches_regex
        target: "(CI|checks|verification|PR state|review)"
        weight: 0.8
      - type: matches_regex
        target: "(merge|root-to-leaf|cleanup|merged branches)"
        weight: 0.7

  - id: parallel_independent_milestones
    prompt: >
      The plan has M2 and M3 with no dependency between them. Run the independent milestone prompts in parallel, but keep the runs isolated and stop the sequence if either one fails.
    fixtures: []
    rubric:
      - "runs design checks serially, then launches each milestone in its own worktree"
      - "requires no dependency and no shared files before running in parallel"
      - "honors the requested stop: if either lane fails, stops the sequence rather than continuing other work"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(independent|parallel|shared files)"
        weight: 0.8
      - type: matches_regex
        target: "(worktree|isolated|separate session)"
        weight: 0.8
      - type: matches_regex
        target: "(fail|stop|dependents)"
        weight: 0.7

  - id: merge_stack_and_cleanup
    prompt: >
      Let's merge the stack for the current milestone. Ensure CI is green for each PR. Once done, clean up all local and remote merged branches.
    fixtures: []
    rubric:
      - "routes merge-and-clean through stacked PR discipline root-to-leaf"
      - "requires green CI before each merge and rechecks after retargets"
      - "cleans only branches verified as merged"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(root-to-leaf|stacked-prs)"
        weight: 0.8
      - type: matches_regex
        target: "(CI|checks|green)"
        weight: 0.8
      - type: matches_regex
        target: "(verified as merged|merged branches)"
        weight: 0.7

  - id: ci_status_question_is_read_only
    prompt: >
      Is CI green on the current milestone stack?
    fixtures: []
    rubric:
      - "reports CI and gate state for each PR in the stack"
      - "does not merge, retarget or clean branches without an explicit merge request"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(CI|checks|green)"
        weight: 0.8
      - type: matches_regex
        target: "(read-only|not merg|no merge|explicit merge)"
        weight: 0.9

  - id: unavailable_qualification_is_not_a_blocker
    prompt: >
      Continue the milestone sequence. M1's stack is reviewed, CI is green and the Done when interaction was observed. A note in the
      previous session suggested paid fresh-model qualification runs before merging, but the plan's acceptance does not list them and
      no budget was authorized.
    fixtures: []
    rubric:
      - "treats M1 as done once acceptance, CI, review and the observed interaction pass"
      - "reports the paid qualification as a suggested follow-up, not a BLOCKED gate"
      - "does not start paid runs or a validation campaign"
      - "moves on to merge M1 and the next ready milestone"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(follow-up|not (a )?block|out of scope)"
        weight: 0.9
      - type: matches_regex
        target: "(merge|next milestone|M2)"
        weight: 0.8

  - id: resume_status_from_external_evidence
    prompt: >
      Where are we on the milestone sequence? The plan's checkboxes say M1-M4 are done, but I am not sure that is true. Then continue.
    fixtures: []
    rubric:
      - "rebuilds status from merged PRs, CI and current code rather than plan checkboxes"
      - "reports what the user can do now, what is merged and what remains"
      - "continues with the next dependency-ready milestone"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(merged PRs|provider|current code|not (from )?checkboxes)"
        weight: 0.9
      - type: matches_regex
        target: "(User can now|can now)"
        weight: 0.7

  - id: design_drift_handling
    prompt: >
      Before running M3, you find the module its prompt names was renamed in M2, and separately M4's prompt would change the user-facing
      acceptance agreed in the plan. Continue the sequence.
    fixtures: []
    rubric:
      - "treats the rename as small drift: DESIGN GO with a plan update in the stack's first commit"
      - "treats M4's acceptance change as DESIGN NO-GO and asks the owner"
      - "continues independent milestones"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(PLAN UPDATE|update the plan)"
        weight: 0.8
      - type: matches_regex
        target: "(DESIGN NO-GO|ask the owner)"
        weight: 0.9

  - id: green_but_unreachable
    prompt: >
      M2's PRs are green and reviewed, but the `report export` command its Done when row promises is not wired into the CLI. Merge it.
    fixtures: []
    rubric:
      - "refuses to call M2 done because the promised interaction is unreachable"
      - "names the missing command and fixes it before merging"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(not done|unreachable|missing command)"
        weight: 0.9

  - id: release_after_train_merges
    prompt: >
      M1 and M2 both ship in v2.4.0 per the plan. M1 is merged and M2 just merged. Continue.
    fixtures: []
    rubric:
      - "hands the v2.4.0 release to release-captain only after both milestones merged"
      - "does not tag or publish without explicit plan or owner authority"
    trigger_expected: true
    assertions:
      - type: contains
        target: "release-captain"
        weight: 0.9
      - type: contains
        target: "v2.4.0"
        weight: 0.7

  - id: negative_generate_plan_prompts
    prompt: >
      Create DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md from the documents in docs/ and save them in .docs.
    fixtures: []
    rubric:
      - "generating plan and prompt files is plan-prompts territory"
    trigger_expected: false

  - id: negative_single_stack_repair
    prompt: >
      This existing stacked PR chain has the wrong base on PR #42. Fix the branch topology and retarget the child PR.
    fixtures: []
    rubric:
      - "repairing one existing stack is stacked-prs territory, not milestone orchestration"
    trigger_expected: false
