cases:
  - id: plan_audit
    prompt: "Review this implementation plan before I start coding"
    fixtures: []
    rubric:
      - "performs multi-section plan audit covering assumptions, risks, and failure modes"
      - "produces severity-tagged findings"
      - "delivers a ship/rethink/reject verdict"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)ship|rethink|reject"
        weight: 1.0
      - type: matches_regex
        target: "(?i)assumption|risk|failure"
        weight: 0.8
      - type: matches_regex
        target: "HIGH|MEDIUM|LOW|CRITICAL"
        weight: 0.8
      - type: matches_regex
        target: "(?i)finding|issue|concern"
        weight: 0.6

  - id: scope_challenge
    prompt: "Stress-test this proposal — what am I missing and where will it break?"
    fixtures: []
    rubric:
      - "challenges implicit assumptions in the plan"
      - "maps failure modes and blast radius for each component"
      - "identifies gaps and missing considerations"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)assumption"
        weight: 1.0
      - type: matches_regex
        target: "(?i)failure.mode|blast.radius|break"
        weight: 0.8
      - type: matches_regex
        target: "(?i)gap|missing"
        weight: 0.8
      - type: matches_regex
        target: "(?i)ship|rethink|reject"
        weight: 0.6

  - id: code_review_not_plan
    prompt: "Review this Python function for bugs and performance issues"
    fixtures: []
    rubric:
      - "does not activate plan review workflow"
      - "code review of existing code is different from pre-implementation plan audit"
    trigger_expected: false

  - id: architecture_diagram
    prompt: "Draw me an architecture diagram for this system"
    fixtures: []
    rubric:
      - "does not activate plan review workflow"
      - "diagram creation is different from plan audit"
    trigger_expected: false

  - id: necessity_now_and_evolvable_architecture
    prompt: >
      Review a plan for letting a user import one local document and search it. M1 builds a distributed job platform,
      M2 adds a provider plugin framework with one provider, and M3 finally wires import/search. Sources require no
      multi-host deployment or second provider. The next release must preserve private document access. M4-M8 have
      only outcomes and dependencies because they are not ready to implement.
      End with one decision per line: "Distributed platform: build now" or "Distributed platform: defer";
      "Provider plugins: build now" or "Provider plugins: defer"; and "Private access: preserve now" or
      "Private access: defer". Explain the selected scope and concrete revisit conditions in the review.
    fixtures: []
    rubric:
      - "challenges infrastructure-first sequencing and recommends the smallest usable import/search slice"
      - "defers unused distributed/plugin capability with a concrete revisit condition while preserving private access"
      - "accepts outcome-level distant milestones rather than demanding premature execution prompts"
      - "uses the default combined lens without a configuration pause or invented dashboards/10x qualification"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?Distributed platform:[ \t]*defer[ \t]*$'
        weight: 1.0
      - type: matches_regex
        target: '(?i)\bimport\b'
        weight: 0.9
      - type: matches_regex
        target: '(?i)\bsearch\b'
        weight: 0.9
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?Provider plugins:[ \t]*defer[ \t]*$'
        weight: 1.0
      - type: matches_regex
        target: '(?im)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?Private access:[ \t]*preserve now[ \t]*$'
        weight: 1.0
      - type: matches_regex
        target: '(?im)\A(?![\s\S]*^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?(?P<field>Distributed platform|Provider plugins|Private access):[^\n]*\n[\s\S]*^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?(?P=field):)'
        weight: 1.0
