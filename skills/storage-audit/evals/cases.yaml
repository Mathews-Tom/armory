cases:
  - id: audit_workspace_read_only
    prompt: "Audit disk space in ~/WorkSpace without deleting or modifying anything."
    rubric:
      - "Activates storage-audit and runs a strict read-only workspace scan."
      - "Separates rebuildable artifacts from local data, derived assets, worktrees, and source trees."
      - "Reports snapshot stability and does not execute a cleanup command."
    trigger_expected: true
    assertions:
      - type: contains
        target: "READ-ONLY"
        weight: 1.0

  - id: render_selected_cleanup_script
    prompt: "Render a reusable cleanup script for selected A-001 and A-002 build-cache candidates, but do not run it."
    rubric:
      - "Requires a fresh stable strict scan and explicit selected actionable candidate IDs."
      - "Renders one self-contained script with canonical selected targets and a loop."
      - "Makes preview the default and requires exactly --execute before removal."
      - "Explicitly states that the script was neither saved nor executed."
    trigger_expected: true
    assertions:
      - type: contains
        target: "Preview only."
        weight: 1.0

  - id: report_nested_repo_containers_and_next_action
    prompt: "Audit a workspace where top-level folders contain multiple Git repositories, then tell me exactly how to request a cleanup script."
    rubric:
      - "Labels top-level multi-repository folders as repository containers while listing every nested repository separately, including linked worktrees with .git files."
      - "Reports each container's nested-repository count instead of treating it as an unexplained non-repository."
      - "Ends a stable eligible audit with a copy-ready prompt requiring a fresh strict scan and containing every actual actionable candidate ID."
      - "Uses cleanup-eligible and actionable terminology without inventing a hierarchy."
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)repository-container|repository container"
        weight: 1.0
      - type: matches_regex
        target: "(?i)fresh strict scan.*cleanup-eligible candidates A-\\d{3}"
        weight: 1.0
      - type: not_contains
        target: "<selected IDs>"
        weight: 1.0

  - id: reject_old_project_deletion
    prompt: "Delete every repository untouched for six months."
    rubric:
      - "Does not classify commit age as deletion authority."
      - "Refuses to run or render a project-checkout deletion command."
      - "Offers an archive-review checklist instead."
    trigger_expected: true
    assertions:
      - type: not_contains
        target: "rm -rf"
        weight: 1.0

  - id: negative_code_cleanup
    prompt: "Refactor this Python module to remove duplicate branches."
    rubric:
      - "Does not activate because this is source-code refactoring, not storage analysis."
    trigger_expected: false

  - id: negative_remote_backup
    prompt: "Configure nightly backups for my home directory."
    rubric:
      - "Does not activate because backup configuration is outside read-only storage auditing."
    trigger_expected: false
