cases:
  - id: docs_folder_to_plan_and_prompts
    prompt: >
      Use the system docs in docs/ to create a development plan and execution prompts for a new multi-milestone service.
      Save the outputs as .docs/DEVELOPMENT_PLAN.md and .docs/EXECUTION_PROMPTS.md.
    fixtures: []
    rubric:
      - "states the size class before writing and chooses the large class for several dependent milestones"
      - "creates DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md under .docs and no other files"
      - "each active milestone has a user-observable outcome, Done when acceptance and exact verification; distant roadmap items have no invented check detail"
      - "only actionable milestones have /goal blocks within 600 words, each carrying the project destination and contribution and ending with literal NEXT STEPS:"
    trigger_expected: true
    assertions:
      - type: contains
        target: ".docs/DEVELOPMENT_PLAN.md"
        weight: 1.0
      - type: contains
        target: ".docs/EXECUTION_PROMPTS.md"
        weight: 1.0
      - type: matches_regex
        target: "(size class|Size|Large|Medium|Small)"
        weight: 0.8
      - type: matches_regex
        target: "(Done when|DONE WHEN)"
        weight: 0.8
      - type: contains
        target: "NEXT STEPS:"
        weight: 0.7

  - id: explicit_files_with_stack_depth
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md from docs/overview.md and docs/design.md,
      treating docs/overview.md as the primary source of truth. Use STACK_DEPTH_HINT=4 and save the final files in .docs.
    fixtures: []
    rubric:
      - "treats the first explicit file as primary source of truth"
      - "defaults to a single cohesive PR; uses the hint only as a ceiling for a justified shallow stack, not four required PRs"
      - "keeps assumptions and gaps visible rather than burying them in prose"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(primary source|source of truth|docs/overview\\.md)"
        weight: 0.8
      - type: matches_regex
        target: "(STACK_DEPTH_HINT|4 PRs|≤ 4|<= 4)"
        weight: 0.8
      - type: matches_regex
        target: "(> ASSUMPTION:|> GAP:|Assumptions & Gaps)"
        weight: 0.8

  - id: small_change_gets_one_prompt
    prompt: >
      Plan the work to add a --json flag to the existing `tasks list` command in this repo and generate the execution prompt for it.
    fixtures: []
    rubric:
      - "classifies the request as the small size class because it fits in one PR"
      - "returns a single /goal prompt of about 200 words in chat, writes no plan files and references no plan file or plan section"
      - "acceptance is a user-observable Done when row plus the repo's existing checks; no added review rounds or qualification"
      - "carries the project workflow and bounded contribution and identifies the prompt as runnable by milestone-runner without generating plan files"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(small|one PR|single PR)"
        weight: 0.9
      - type: matches_regex
        target: "(no plan files|without writing|not writing|in chat)"
        weight: 0.8
      - type: matches_regex
        target: "(Done when|DONE WHEN)"
        weight: 0.7
      - type: not_contains
        target: "--- FILE:"
        weight: 0.9
      - type: not_contains
        target: "Plan §"
        weight: 0.8

  - id: unsourced_validation_becomes_follow_up
    prompt: >
      Create DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md from docs/spec.md for two skill wording changes. The spec asks only for the
      edited skill text and the repo's existing validators. While planning you notice fresh-model behavioral runs and a paid qualification
      campaign could add confidence.
    fixtures: []
    rubric:
      - "acceptance is limited to the edited text, the repo validators and an observable check the executor can run now"
      - "fresh-model runs and paid qualification appear only under Suggested follow-ups, not as acceptance or a BLOCKED state"
      - "does not invent requirement-ID catalogues, scenario suites or evidence tiers absent from the spec"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(Suggested follow-ups|follow-up)"
        weight: 0.9
      - type: matches_regex
        target: "(not (an )?acceptance|out of scope|not required|optional)"
        weight: 0.8

  - id: shared_release_train_planning
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md for a repository where M1 and M2 both ship in v2.4.0.
      The repository stores its version in VERSION, maintains CHANGELOG.md, and does not publish tags automatically.
    fixtures: []
    rubric:
      - "assigns M1 and M2 to the v2.4.0 release"
      - "prepares the release once, after both milestones merge, not per milestone"
      - "does not invent tagging or publication steps"
    trigger_expected: true
    assertions:
      - type: contains
        target: "v2.4.0"
        weight: 0.9
      - type: matches_regex
        target: "(after (both|all)|once).*(merge)"
        weight: 0.8

  - id: unresolved_release_target
    prompt: >
      Create the plan and prompts from docs/. The docs say a release will happen but never name a version, and the repo has no VERSION file.
    fixtures: []
    rubric:
      - "records a visible > GAP: for the release target"
      - "blocks release preparation only, not implementation"
      - "never invents a version number"
    trigger_expected: true
    assertions:
      - type: contains
        target: "> GAP:"
        weight: 0.9
      - type: matches_regex
        target: "(release preparation only|blocks? release preparation)"
        weight: 0.8

  - id: brownfield_replan
    prompt: >
      Replan .docs/DEVELOPMENT_PLAN.md. M1 shipped working search; M2 and M3 were six layered infrastructure milestones that never
      produced a usable result. Regenerate both files around the shortest path to a user-visible detail view.
    fixtures: []
    rubric:
      - "reads the existing plan and prompts before regenerating"
      - "maps every old milestone to keep, combine, defer or drop with a reason"
      - "preserves working search and keeps unresolved historical failures visible"
      - "replaces layer milestones with a usable vertical slice"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(keep|combine|defer|drop)"
        weight: 0.9
      - type: matches_regex
        target: "(vertical slice|usable|user-visible)"
        weight: 0.8

  - id: destructive_human_gate
    prompt: >
      Plan the milestones for a data-retention feature whose M3 permanently deletes expired customer records.
    fixtures: []
    rubric:
      - "adds the HUMAN REVIEW GATE to the destructive milestone"
      - "keeps the gate tied to dry-run output, rollback notes and audit/tombstone logging"
    trigger_expected: true
    assertions:
      - type: contains
        target: "HUMAN REVIEW GATE"
        weight: 1.0

  - id: necessary_now_not_merely_vision_relevant
    prompt: >
      Plan the first usable CSV import from docs/spec.md. The approved vision includes third-party import plugins and multiple databases,
      but the current workflow imports one local CSV into the existing database. An internal proposal wants a plugin registry,
      universal storage adapter and metrics dashboard first. Import must prevent duplicate records on retry, and the new record ID
      will become a permanent external identifier. Choose what belongs now and what should wait.
    fixtures: []
    rubric:
      - "keeps current import correctness including duplicate prevention and the irreversible external-ID constraint in the usable slice"
      - "defers the plugin registry, universal storage adapter and dashboard absent a necessary-now consumer despite their relevance to the vision"
      - "gives concrete revisit conditions such as an approved second importer or second database, not vague future hardening"
      - "preserves an ordinary maintainable boundary rather than replacing deferred abstractions with equivalent infrastructure work"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)(defer|not now|follow-up)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)(duplicate|retry|external.{0,20}(ID|identifier)|irreversible)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)(revisit|second importer|second database)"
        weight: 0.8

  - id: rolling_wave_actionable_prompts_only
    prompt: >
      Generate the plan and execution prompts for an approved reporting product. M1 lets an operator export the current report as CSV
      using the existing CLI; its acceptance and local checks are known. Later M2 adds scheduled delivery once the owner chooses the
      delivery channel, and M3 adds multi-team access after the tenancy decision. Only M1 is ready. Keep the project destination visible.
    fixtures: []
    rubric:
      - "details M1's working workflow, acceptance and verification and emits its actionable prompt with the project destination and contribution"
      - "keeps M2 and M3 to roadmap outcomes, dependencies and unresolved constraints, without invented PR/file/check detail or placeholder prompts"
      - "explains that the runner materializes a next-ready prompt from approved outcomes and constraints using current repo detail without routine owner approval"
      - "retains owner approval for delivery/tenancy decisions and any outcome or acceptance changes"
      - "defaults M1 to one cohesive PR and does not turn later roadmap items into mandatory stack layers"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)(roadmap|rolling.wave)"
        weight: 0.9
      - type: matches_regex
        target: "(?i)(materializ|render|activat).{0,100}(prompt|ready)"
        weight: 0.8

  - id: roadmap_only_has_no_synthetic_execution
    prompt: >
      Update DEVELOPMENT_PLAN.md with only the approved future outcome: teams can share a report once the owner resolves tenancy.
      There is no actionable implementation milestone yet. Keep it as a roadmap rather than inventing scope or acceptance.
    fixtures: []
    rubric:
      - "records the outcome and unresolved tenancy constraint without speculative implementation, checks or PR breakdown"
      - "does not write EXECUTION_PROMPTS.md or a placeholder /goal just to satisfy a universal two-file rule"
      - "does not claim that future roadmap work has runnable acceptance or completed verification"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)(roadmap|not actionable|no actionable)"
        weight: 0.9

  - id: active_prompt_delegates_ci_and_bounds_review
    prompt: >
      Generate an execution prompt for the approved export milestone. Repo policy requires unit and security checks and explicitly
      classifies the nightly performance report as advisory. It also requires local CLI preflight. The work fits one PR, though
      the planning template previously used two PRs by default. Keep correctness review substantive without an open-ended loop.
    fixtures: []
    rubric:
      - "uses one cohesive PR and carries local preflight plus the observed export interaction"
      - "preserves unit/security required checks and delegates classification/landing to repository policy and ship-workflow"
      - "reports an advisory failure without calling it green and does not exempt an unclassified failing job"
      - "specifies one primary review, targeted re-review after fixes and escalation after at most three unsuccessful fix rounds without merging defects"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)(advisory|ship-workflow)"
        weight: 0.8
      - type: matches_regex
        target: "(?i)(three|3).{0,70}(round|fix|unsuccessful)"
        weight: 0.8

  - id: negative_existing_plan_review
    prompt: >
      Review this existing DEVELOPMENT_PLAN.md and stress-test its assumptions, scope, risk, and failure modes before we implement it.
    fixtures: []
    rubric:
      - "existing plan review is plan-review territory, not generation from source docs"
    trigger_expected: false

  - id: negative_execute_stack
    prompt: >
      Use the execution prompts in .docs/EXECUTION_PROMPTS.md to create the stacked PRs and drive them to green.
    fixtures: []
    rubric:
      - "executing stacked PRs is stacked-prs territory, not plan/prompt generation"
    trigger_expected: false

  - id: negative_unresolved_destination
    prompt: "The destination itself is still unclear. Identify the questions we must resolve."
    fixtures: []
    rubric:
      - "Does not activate; unresolved pre-planning decisions belong to decision-map"
    trigger_expected: false
