cases:
  - id: docs_folder_to_plan_and_prompts
    prompt: >
      Use the system docs in docs/ to create a source-faithful development plan and execution prompts.
      Save the outputs as .docs/DEVELOPMENT_PLAN.md and .docs/EXECUTION_PROMPTS.md. Make the review process in each execution prompt robust enough for per-PR and whole-stack review, and make every milestone end with a structured GO/NO-GO merge decision.
    fixtures: []
    rubric:
      - "creates DEVELOPMENT_PLAN.md, EXECUTION_PROMPTS.md, and the mandatory ignored DEVELOPMENT_PLAN_HISTORY.md ledger under .docs"
      - "includes source map, assumptions/gaps, dependency graph, milestones, acceptance, and verification"
      - "includes one /goal block per milestone with detailed per-PR and whole-stack review criteria"
      - "requires every milestone run to report GO/NO-GO with evidence for merge readiness"
    trigger_expected: true
    assertions:
      - type: contains
        target: ".docs/DEVELOPMENT_PLAN.md"
        weight: 1.0
      - type: contains
        target: ".docs/EXECUTION_PROMPTS.md"
        weight: 1.0
      - type: contains
        target: ".docs/DEVELOPMENT_PLAN_HISTORY.md"
        weight: 0.9
      - type: matches_regex
        target: "(gitignore|gitignored|check-ignore)"
        weight: 0.8
      - type: matches_regex
        target: "(Source Map|Assumptions|Gaps|Dependency Graph|Milestones)"
        weight: 0.8
      - type: matches_regex
        target: "(/goal|PLANNED STACK|Per PR|Whole stack|whole-stack|GO/NO-GO)"
        weight: 0.8
      - type: output_format
        target: markdown_table
        weight: 0.6

  - id: explicit_files_with_stack_depth
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md from docs/overview.md and docs/design.md,
      treating docs/overview.md as the primary source of truth. Use STACK_DEPTH_HINT=4 and save the final files in .docs.
    fixtures: []
    rubric:
      - "treats the first explicit file as primary source of truth"
      - "caps each milestone planned stack at the requested depth"
      - "keeps assumptions and gaps visible rather than burying them in prose"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(primary source|source of truth|docs/overview\\.md)"
        weight: 0.8
      - type: matches_regex
        target: "(STACK_DEPTH_HINT|4 PRs|≤ 4|<= 4)"
        weight: 0.8
      - type: matches_regex
        target: "(> ASSUMPTION:|> GAP:|Assumptions & Gaps)"
        weight: 0.8
      - type: contains
        target: "EXECUTION_PROMPTS.md"
        weight: 0.6

  - id: greenfield_verification_surface
    prompt: >
      I have architecture notes in specs/ for a greenfield CLI tool. Turn them into .docs/DEVELOPMENT_PLAN.md
      and .docs/EXECUTION_PROMPTS.md. There is no repo setup yet, so include whatever first milestone is needed to make later work verifiable.
    fixtures: []
    rubric:
      - "plans a first milestone that establishes project skeleton and verification surface"
      - "does not assume an existing CI, linter, type checker, or test runner without evidence"
      - "keeps later milestones self-verifiable through the M1 tooling"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(M1|first milestone).*(verification|test|CI|skeleton|scaffold)"
        weight: 0.8
      - type: matches_regex
        target: "(greenfield|no repo setup|verification surface)"
        weight: 0.6
      - type: contains
        target: "DEVELOPMENT_PLAN.md"
        weight: 0.6

  - id: shared_release_train_planning
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md for a repository where M1 and M2 both ship in v2.4.0.
      The repository stores its version in VERSION, maintains CHANGELOG.md, and does not publish tags automatically.
      Keep version and changelog preparation deferred until both milestones merge; do not create one release entry per milestone.
    fixtures: []
    rubric:
      - "assigns M1 and M2 to the shared v2.4.0 release train"
      - "records VERSION and CHANGELOG.md as release artifacts, with no publication step"
      - "requires release preparation only after every train milestone merges"
      - "emits release-aware GO/NO-GO verdicts that name the target release"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(Release Trains|release train|Target release|v2\\.4\\.0)"
        weight: 1.0
      - type: matches_regex
        target: "(VERSION|CHANGELOG\\.md)"
        weight: 0.9
      - type: matches_regex
        target: "(all.*milestones.*merge|all included milestones.*merged|deferred|release preparation)"
        weight: 0.9
      - type: matches_regex
        target: "(GO.*RELEASE|NO-GO.*RELEASE|RELEASE PREP)"
        weight: 0.9

  - id: unresolved_release_target
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md for source docs that do not identify a release target.
      The repository has VERSION and CHANGELOG.md, but no documented release policy. Do not infer a version, changelog entry,
      tag, or publication action.
    fixtures: []
    rubric:
      - "emits a visible release-target GAP rather than inventing a semantic version"
      - "propagates the unresolved release target into the release-aware NO-GO path"
      - "does not prescribe a version bump, changelog entry, tag, or publication action without source evidence"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(> GAP:|GAP:|unresolved release target|release target.*unresolved)"
        weight: 1.0
      - type: matches_regex
        target: "(NO-GO.*RELEASE|RELEASE.*NO-GO|REASON.*blocking)"
        weight: 0.9
      - type: matches_regex
        target: "(do not infer|do not invent|not requested|without source evidence)"
        weight: 0.8

  - id: negative_existing_plan_review
    prompt: >
      Review this existing DEVELOPMENT_PLAN.md and stress-test its assumptions, scope, risk, and failure modes before we implement it.
    fixtures: []
    rubric:
      - "existing plan review is plan-review territory, not generation from source docs"
    trigger_expected: false

  - id: negative_execute_stack
    prompt: >
      Use the execution prompts in .docs/EXECUTION_PROMPTS.md to create the stacked PRs and drive them to green.
    fixtures: []
    rubric:
      - "executing stacked PRs is stacked-prs territory, not plan/prompt generation"
    trigger_expected: false

  - id: adaptive_milestone_design_gate
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md for M1 through M6. M4 changed
      the persistence interface that M5 and M6 depend on. Before M5 implementation, require an
      evidence-backed design gate that updates M5 and every affected future milestone before code
      can start.
    fixtures: []
    rubric:
      - "adds a mandatory DESIGN GO or DESIGN NO-GO gate before implementation"
      - "requires repository and predecessor-evidence analysis rather than relying on the old plan"
      - "updates the current milestone and every affected transitive dependent prompt and plan section"
      - "blocks code when the design is invalid or reconciliation is incomplete"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(DESIGN GO|DESIGN NO-GO|design gate|design reconciliation)"
        weight: 1.0
      - type: matches_regex
        target: "(predecessor|merged PR|current codebase|repository evidence)"
        weight: 0.9
      - type: matches_regex
        target: "(dependent|downstream|transitive|M6)"
        weight: 0.9
      - type: matches_regex
        target: "(block.*code|before.*implementation|do not.*implement)"
        weight: 0.9

  - id: ignored_plan_history_ledger
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md with one local,
      gitignored .docs/DEVELOPMENT_PLAN_HISTORY.md ledger. It must record each design-gate
      decision, evidence, plan/prompt changes, and downstream impact, but the committed plan
      and prompts remain authoritative.
    fixtures: []
    rubric:
      - "creates exactly one additional history artifact at the requested path"
      - "ensures the exact history path is gitignored without assuming a broader ignore rule"
      - "treats the ledger as local evidence rather than authoritative planning state"
      - "records no-change and changed design-gate decisions with evidence and impact"
    trigger_expected: true
    assertions:
      - type: contains
        target: ".docs/DEVELOPMENT_PLAN_HISTORY.md"
        weight: 1.0
      - type: matches_regex
        target: "(gitignore|gitignored|check-ignore)"
        weight: 0.9
      - type: matches_regex
        target: "(authoritative|source of truth|committed plan)"
        weight: 0.8
      - type: matches_regex
        target: "(evidence|downstream impact|PLAN REVISION)"
        weight: 0.8

  - id: terminal_next_steps_contract
    prompt: >
      Generate DEVELOPMENT_PLAN.md and EXECUTION_PROMPTS.md for M4 and M5 in release v3.1.0,
      plus M6 in independent release v3.2.0. Every milestone must report concrete next steps:
      a green M4 stack needs merge, deferred v3.1.0 preparation, and its next milestone; a
      migration-verification NO-GO for M4 needs remediation and may skip to independent M6.
      Do not tag or publish without source evidence.
    fixtures: []
    rubric:
      - "requires ordered NEXT STEPS after both GO and NO-GO terminal verdicts"
      - "links GO handoff to merge state, deferred or required release preparation, and a next dependency-ready milestone"
      - "links NO-GO handoff to the failed gate, remediation and retry, and only an independent milestone that may proceed"
      - "does not invent tag or publication work"
    trigger_expected: true
    assertions:
      - type: contains
        target: "NEXT STEPS"
        weight: 1.0
      - type: matches_regex
        target: "(GO.*merge|merge.*GO|NO-GO)"
        weight: 0.9
      - type: matches_regex
        target: "(release preparation|RELEASE PREP|deferred)"
        weight: 0.9
      - type: matches_regex
        target: "(migration|remediat|retry)"
        weight: 0.9
      - type: matches_regex
        target: "(M6|independent|SKIP.*RUN)"
        weight: 0.9
      - type: matches_regex
        target: "(do not tag|do not publish|without source evidence)"
        weight: 0.8
