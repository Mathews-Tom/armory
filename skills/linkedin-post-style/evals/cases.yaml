cases:
  - id: observational_post_from_notes
    prompt: "Write a LinkedIn post about this: Google released Gemini 2.5 Pro. It scores 92% on SWE-bench. It can handle 1M token context. It's their best coding model yet."
    fixtures: []
    rubric:
      - "Uses 5-act structure: hook, legend, credibility, observation, meaning"
      - "Hook is a specific metric or fact, not an opinion"
      - "No exclamation marks or emoji anywhere in the post"
      - "No superlatives such as 'incredible', 'amazing', or 'game-changing'"
      - "Withholds first-person ('I', 'my', 'me') until late in the post"
      - "Post length is 150-300 words"
    trigger_expected: true
    assertions:
      - type: not_contains
        target: "!"
        weight: 1.0
      - type: not_contains
        target: "incredible"
        weight: 0.8
      - type: not_contains
        target: "game-changing"
        weight: 0.8
      - type: not_contains
        target: "#"
        weight: 0.6
      - type: matches_regex
        target: "92%|SWE-bench|1M|Gemini"
        weight: 0.6

  - id: rewrite_existing_draft
    prompt: "Rewrite this for LinkedIn in my style: 'Excited to announce that our team just shipped an amazing new AI feature! It's incredible how much faster developers can code now. What do you think? #AI #DevTools #Innovation'"
    fixtures: []
    rubric:
      - "Removes all anti-patterns: exclamation marks, 'excited to announce', superlatives, hashtags in body, audience question"
      - "Moves links and hashtags to comment section or omits them from the post body"
      - "Preserves the core technical content (team shipped an AI feature that speeds up developer coding)"
      - "Applies informed-casual voice throughout"
    trigger_expected: true
    assertions:
      - type: not_contains
        target: "Excited to announce"
        weight: 1.0
      - type: not_contains
        target: "amazing"
        weight: 0.8
      - type: not_contains
        target: "What do you think?"
        weight: 0.8
      - type: not_contains
        target: "!"
        weight: 0.8
      - type: not_contains
        target: "#AI"
        weight: 0.6

  - id: experience_post
    prompt: "Draft a post about my experience using Cursor vs Claude Code for the past month. Cursor is good for small edits but Claude Code handles complex refactors better. I switched fully to Claude Code."
    fixtures: []
    rubric:
      - "Uses early first-person ('I', 'my') consistent with experience post pattern"
      - "No hedging qualifiers ('maybe', 'perhaps', 'I think', 'it seems')"
      - "Contains specific observations rather than generalizations"
      - "Ends with a meaning layer (broader implication or insight), not a call-to-action or audience question"
    trigger_expected: true
    assertions:
      - type: not_contains
        target: "!"
        weight: 1.0
      - type: not_contains
        target: "What do you think"
        weight: 0.8
      - type: matches_regex
        target: "(?i)cursor|claude code"
        weight: 0.8
      - type: not_contains
        target: "incredible"
        weight: 0.6
      - type: not_contains
        target: "#"
        weight: 0.6

  - id: generic_writing_request
    prompt: "Write a professional email to my manager about taking time off next week."
    fixtures: []
    rubric:
      - "Does not apply LinkedIn post style rules (this is an email, not LinkedIn content)"
    trigger_expected: false

  - id: technical_blog_post
    prompt: "Write a 2000-word technical blog post about database sharding strategies."
    fixtures: []
    rubric:
      - "Does not apply LinkedIn post style rules (this is long-form blog content, not LinkedIn short-form post)"
    trigger_expected: false

  - id: preserve_signed_source_link
    prompt: "Rewrite this for LinkedIn in my style, keeping the source link in the first comment exactly: 'Our batch worker cut p95 from 80 ms to 25 ms. Source: https://example.org/results?utm_source=chatgpt.com&sig=abc123'"
    fixtures: []
    rubric:
      - "Preserves the signed source URL and every query parameter exactly, even when moving it to a comment"
      - "Preserves both latency measurements without claiming that a style check verified the benchmark"
    trigger_expected: true
    assertions:
      - type: contains
        target: "https://example.org/results?utm_source=chatgpt.com&sig=abc123"
      - type: matches_regex
        target: "80\\s*ms"
      - type: matches_regex
        target: "25\\s*ms"

  - id: html_video_companion_engine_choice
    prompt: "Write a LinkedIn post about how our agent's retry behavior changed over 14 days of traces, and plan a short Hyperframes HTML video to go with it"
    fixtures: []
    rubric:
      - "Writes the post in the author's voice first, using the 5-act structure"
      - "Routes the video to html-video because Hyperframes was named explicitly, not to animate or remotion-video"
      - "Treats the subject as temporal (behavior change over time) and keeps the video optional rather than required"
      - "Does not claim the video was rendered or that any toolchain was installed"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(?i)html-video"
        weight: 1.0
      - type: not_contains
        target: "!"
        weight: 0.6

  - id: pure_text_post_no_companion
    prompt: "Write a LinkedIn post about this: our CI queue time dropped from 14 minutes to 6 after we cached the dependency layer. Text only, no visuals."
    fixtures: []
    rubric:
      - "Produces only the post text and does not invoke or recommend any visual companion skill"
      - "Does not mention html-video, animate, remotion-video, md-to-pdf or concept-to-image as required steps"
      - "Preserves the 14 minute and 6 minute figures"
    trigger_expected: true
    assertions:
      - type: not_contains
        target: "html-video"
        weight: 1.0
      - type: not_contains
        target: "remotion-video"
        weight: 0.8
      - type: matches_regex
        target: "14\\s*min"
        weight: 0.6

  - id: plain_html_page_not_video
    prompt: "Build me a single HTML landing page with a CSS animated hero section for my product"
    fixtures: []
    rubric:
      - "An ordinary web page with no video output is not a LinkedIn post or a video request; linkedin-post-style does not activate and html-video is not selected"
    trigger_expected: false
