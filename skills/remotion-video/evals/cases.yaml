cases:
  - id: branded_product_launch_video
    prompt: >
      Create a Remotion video for our product launch with our brand colors (#1A1A2E, #E94560),
      logo at assets/logo.png, and background music from assets/launch-track.mp3.
    fixtures: []
    rubric:
      - "sets up Remotion React project with composition and video entry point"
      - "uses TailwindCSS or styled-components for styling with specified brand colors"
      - "includes audio sync via Remotion Audio component with the background music file"
    trigger_expected: true
    assertions:
      - type: contains
        target: "Composition"
        weight: 1.0
      - type: matches_regex
        target: "(useCurrentFrame|interpolate|spring)"
        weight: 1.0
      - type: matches_regex
        target: "(Audio|audio)"
        weight: 0.8
      - type: matches_regex
        target: "(#1A1A2E|#E94560)"
        weight: 0.8
      - type: matches_regex
        target: "(tsx|jsx|React)"
        weight: 0.6

  - id: data_driven_revenue_video
    prompt: >
      Generate a data-driven video showing monthly revenue growth from this CSV data.
      The video should animate bar charts with labeled axes and smooth transitions.
    fixtures: []
    rubric:
      - "creates React composition with data input props for CSV-sourced revenue data"
      - "animates chart or data visualization using Remotion interpolate/spring"
      - "produces renderable video via Remotion CLI or renderMedia"
    trigger_expected: true
    assertions:
      - type: contains
        target: "Composition"
        weight: 1.0
      - type: matches_regex
        target: "(interpolate|spring)"
        weight: 1.0
      - type: matches_regex
        target: "(chart|bar|data)"
        weight: 0.8
      - type: matches_regex
        target: "(props|Props)"
        weight: 0.6
      - type: matches_regex
        target: "(render|npx remotion)"
        weight: 0.6

  - id: negative_math_proof_animation
    prompt: "Animate a math proof step by step showing the derivation of Euler's identity"
    fixtures: []
    rubric:
      - "mathematical proof animation is animate/Manim territory, not Remotion"
    trigger_expected: false

  - id: negative_static_product_image
    prompt: "Create a static image of our product on a white background for the website hero section"
    fixtures: []
    rubric:
      - "static image generation is not a video task"
    trigger_expected: false

  - id: negative_explicit_hyperframes_html_video
    prompt: "Make a title sequence video from plain HTML and CSS rendered with Hyperframes"
    fixtures: []
    rubric:
      - "explicit Hyperframes or plain HTML/CSS video is html-video territory, not Remotion"
    trigger_expected: false

  - id: html_inside_react_composition
    prompt: "Create a Remotion video whose scenes render HTML and CSS pricing tables inside React components"
    fixtures: []
    rubric:
      - "HTML inside a React/Remotion composition stays remotion-video"
      - "uses Remotion compositions and does not redirect to html-video"
    trigger_expected: true

  - id: negative_plain_web_page
    prompt: "Build an HTML and CSS pricing web page for the site"
    fixtures: []
    rubric:
      - "an ordinary web page with no video output is not a Remotion task"
    trigger_expected: false

  - id: explicit_remotion_math_animation
    prompt: "Use React and Remotion to animate the derivation of Euler's identity"
    fixtures: []
    rubric:
      - "honors the explicit React/Remotion engine even for mathematical content"
      - "does not redirect to Manim solely because the topic is math"
    trigger_expected: true

  - id: negative_explicit_manim_brand_video
    prompt: "Use Manim to make a branded product launch animation"
    fixtures: []
    rubric:
      - "the explicit Manim engine outranks generic branded-video preferences"
    trigger_expected: false
