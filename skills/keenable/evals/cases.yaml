cases:
  - id: keyless_search_api_pricing
    prompt: "Search without an API key for the latest Claude API pricing and rate limits"
    fixtures: []
    rubric:
      - "uses Keenable search for keyless web search"
      - "returns snippets with relevant pricing information"
      - "does not require TAVILY_API_KEY or other vendor keys"
      - "passes --keyless so the public endpoint is used even if KEENABLE_API_KEY is set"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(search\\.mjs|keenable|Keenable)"
        weight: 1.0
      - type: matches_regex
        target: "--keyless"
        weight: 0.9
      - type: matches_regex
        target: "(pric|rate limit|cost)"
        weight: 0.8
      - type: matches_regex
        target: "(https?://|url|source)"
        weight: 0.6

  - id: keyless_search_react
    prompt: "Run a keyless web search for React Server Components best practices and patterns"
    fixtures: []
    rubric:
      - "performs keyless web search via Keenable"
      - "returns relevant results with source attribution"
      - "passes --keyless so the public endpoint is used even if KEENABLE_API_KEY is set"
    trigger_expected: true
    assertions:
      - type: matches_regex
        target: "(search\\.mjs|keenable|Keenable)"
        weight: 1.0
      - type: matches_regex
        target: "--keyless"
        weight: 0.9
      - type: matches_regex
        target: "(React|Server Component)"
        weight: 0.8
      - type: matches_regex
        target: "(https?://|url|source)"
        weight: 0.6

  - id: negative_generic_web_search
    prompt: "Search the web for the latest Claude API pricing and rate limits"
    fixtures: []
    rubric:
      - "generic search the web belongs to tavily, not keyless Keenable routing"
    trigger_expected: false

  - id: negative_url_fetch
    prompt: "Fetch the content from https://docs.anthropic.com/en/api/getting-started"
    fixtures: []
    rubric:
      - "direct URL fetching is web-fetch territory when Keenable is not already active"
    trigger_expected: false

  - id: negative_local_file
    prompt: "Read the contents of /etc/hosts for me"
    fixtures: []
    rubric:
      - "local filesystem operations are outside web search scope"
    trigger_expected: false
