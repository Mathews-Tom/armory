cases:
  # --- Positive cases ---
  - id: capture_existing_package_gap
    prompt: "/librarian capture --source current-task. We worked around stacked-prs treating pre-retarget CI as fresh. Record the reusable lesson, but do not draft, edit, spawn refinement, or open a PR."
    fixtures: []
    rubric:
      - "Activates skill-librarian in capture mode"
      - "Classifies the lesson as augment_existing with target stacked-prs"
      - "Sanitizes and deduplicates before writing at most one UUID-named observation"
      - "Stops after the capture receipt without drafting, editing, spawning refinement, running git, or calling GitHub"
    trigger_expected: true

  - id: capture_sensitive_transcript
    prompt: "Librarian capture: explicitly supplied completed-task transcript (synthetic). Token: synthetic-secret-do-not-retain. Private customer URL: https://private-client.invalid/rollback. Client: Synthetic Customer. We corrected a repeated package workflow that attempted a rollback without checking the already-documented recovery boundary. Capture only the generalized rollback lesson, not the transcript."
    fixtures: []
    rubric:
      - "Uses only the explicitly supplied transcript and runs the privacy pass before constructing a record, proposal summary, receipt, or downstream prompt"
      - "Never copies the supplied token, private URL, client identity, raw excerpt, or identifying source locator into any artifact or receipt"
      - "Stores only a generalized principle and non-secret locator in existing fields, or returns no_action when safe generalization is impossible"
      - "Does not send sensitive material to downstream agents or a public PR, search unrelated sessions, or implement a rollback change"
    trigger_expected: true

  - id: capture_explicit_source_unavailable
    prompt: "/librarian capture --source ./unavailable-transcript.txt. This explicitly selected transcript is unavailable in the supplied environment; no current-task transcript was supplied as an alternative."
    fixtures: []
    rubric:
      - "Selects explicit-transcript capture and reports the unavailable source prerequisite without claiming to have read it"
      - "Writes no observation, does not create the queue directory and never substitutes current-task data or mines historical sessions"
      - "Keeps the source report privacy-safe and does not invent an executable capture API or new command flags"
    trigger_expected: true

  - id: consolidate_duplicate_observation
    prompt: "Capture this skill lesson. An open observation already states the same retry-boundary principle for paid-experiment-run-execution-and-recovery."
    fixtures: []
    rubric:
      - "Acquires the store-wide mutation lock and repeats the match search"
      - "Re-reads and atomically consolidates the matching record"
      - "Increments instances and appends only a sanitized evidence locator"
      - "Does not create a duplicate observation file"
    trigger_expected: true

  - id: serialize_concurrent_captures
    prompt: "Two librarian capture invocations are running concurrently against the same queue and found the same principle."
    fixtures: []
    rubric:
      - "Each writer attempts exclusive creation of the store-wide mutation lock"
      - "Only the lock owner mutates the queue; the other returns queue_busy without writing"
      - "The owner repeats deduplication after acquiring the lock and publishes the complete record atomically"
      - "No invocation overwrites or removes a lock with a different owner token"
    trigger_expected: true

  - id: report_librarian_status
    prompt: "/librarian status"
    fixtures: []
    rubric:
      - "Reads only observation header fields needed for aggregate counts"
      - "Reports open, parked, verdict, age, and distinct-target counts"
      - "Does not read evidence bodies or mutate the queue"
      - "Does not draft, invoke downstream packages, run git, or call GitHub"
    trigger_expected: true

  - id: review_bounded_target_batch
    prompt: "/librarian review --target stacked-prs --limit 10"
    fixtures: []
    rubric:
      - "Filters by stacked-prs, orders oldest first, and applies limit 10 before reading full bodies"
      - "Verifies and clusters the selected observations"
      - "Presents sanitized dispositions and exact downstream paths"
      - "Stops for explicit approval before any package mutation or refinement spawn"
    trigger_expected: true

  - id: no_action_on_trivial_task
    prompt: "Skill-librarian: capture a lesson from this conversation. We only ran git status."
    fixtures: []
    rubric:
      - "Classifies the task as no_action"
      - "Writes no observation and does not create the queue directory"
      - "Does not invoke paper-to-skill, package-optimizer, test-engineer, git, or GitHub"
    trigger_expected: true

  - id: parent_only_write_with_subagents
    prompt: "Capture reusable lessons from this completed task. Three subagents supplied candidate observations."
    fixtures: []
    rubric:
      - "Keeps every queue write in the controller agent"
      - "Serializes controller writes through the store-wide mutation lock"
      - "Sanitizes, verifies, and deduplicates before persisting at most one observation"
    trigger_expected: true

  - id: capture_existing_unwired_check
    prompt: "/librarian capture --source current-task. Completed synthetic task evidence: debug-investigator missed a banned import across repeated repositories. The supplied package.json snapshot declares lint running an existing rule that rejects that import; the supplied CI snapshot runs only tests, and no hook invokes lint. The completed task showed lint rejecting the bad import. Record the reusable lesson, not a patch."
    fixtures: []
    rubric:
      - "Uses the existing language-guided capture surface and classifies a reusable augment_existing lesson targeting debug-investigator, not a new retro or guardrail package"
      - "Identifies automated checks or mechanical coding standards and present but unwired guardrail; uses supplied command, rule and CI evidence instead of assuming a declared lint script runs"
      - "Records repair of existing invocation wiring as prevention intent, rather than proposing a duplicate lint rule or prose prohibition"
      - "Encodes category and guardrail state in disposition_reason, generalized principle in principle and sanitized locators in evidence without adding schema keys or enum values"
      - "Sanitizes, locks and deduplicates before retaining at most one observation; returns the unchanged capture receipt contract and never executes checks, edits wiring, drafts a patch or spawns refinement"
    trigger_expected: true

  - id: capture_missing_deterministic_check
    prompt: "/librarian capture --source current-task. Completed synthetic task evidence: debug-investigator repeatedly missed a banned import. Supplied build and lint configuration contains no rule for it; supplied hook and CI snapshots run existing lint and tests successfully but neither checks this import. The task demonstrated that the import is a fixed syntactic violation. Record the reusable prevention lesson."
    fixtures: []
    rubric:
      - "Inspects the supplied command definitions and hook/CI consumers, distinguishing an absent relevant check from an existing broken or unwired one"
      - "Selects a cheapest repository-native deterministic-check prevention intent for this mechanical failure, not reviewer judgment guidance or repair of a nonexistent rule"
      - "Uses augment_existing targeting debug-investigator with missing relevant guardrail described in existing free-text fields, not a new verdict or package by default"
      - "Records only sanitized evidence and returns a capture receipt without drafting the rule, changing the repository or claiming any check ran during capture"
    trigger_expected: true

  - id: capture_existing_broken_check
    prompt: "Librarian capture from this completed synthetic task: debug-investigator trusted the import rule because CI invoked lint. Supplied lint configuration contains the rule and supplied CI invokes it, but its include pattern excludes the affected source tree. This recurring coverage mistake caused the banned import to ship. Record the lesson without fixing files."
    fixtures: []
    rubric:
      - "Distinguishes a present but ineffective coverage guardrail from both missing invocation wiring and an absent rule"
      - "Records repair of the existing coverage pattern as the bounded prevention intent before considering another check, instruction or skill"
      - "Preserves existing observation schema, enum values and sanitize-before-retention and receipt boundaries"
      - "Does not repair configuration or claim to have re-executed lint during capture"
    trigger_expected: true

  - id: capture_navigation_pointer
    prompt: "Capture a reusable lesson from the completed task: repeated debug-investigator runs searched generated clients instead of the canonical schema because the package's existing navigation pointer omits the generation dependency. The task supplied the canonical schema and generator documentation locators. No edit is requested."
    fixtures: []
    rubric:
      - "Classifies navigation and records an augment_existing lesson targeting debug-investigator with the evidenced dependency and sanitized source locators"
      - "Selects repair of a conditional pointer naming when to read the existing schema/generator documentation, not copying source contents into global instructions or creating another skill"
      - "Stops at the capture receipt after privacy, deduplication and locked persistence; no document edits or drafted patch"
    trigger_expected: true

  - id: capture_judgment_review_standard
    prompt: "Capture this completed-task lesson for debug-investigator: the review missed a cross-file naming inconsistency that was syntactically valid and depended on domain meaning. Supplied reviewer guidance has a relevant but ambiguous consistency section. The completed task's examples show why a fixed banned-name rule would reject valid code."
    fixtures: []
    rubric:
      - "Classifies coding standards as genuine judgment and points to the supplied existing reviewer guidance"
      - "Records clarification for review using the evidenced distinction and counterexample, not a deterministic syntactic rule or more implementation-agent instructions"
      - "Uses existing observation fields and approval-gated review path without editing reviewer guidance during capture"
    trigger_expected: true

  - id: capture_tool_economy
    prompt: "Librarian capture: the completed task repeatedly dumped entire build logs through debug-investigator and lost the relevant failure among unrelated lines. The transcript shows that one existing scoped log query included the error, its causal context and exit status with less redundant output. Capture the reusable lesson; we did not measure tokens or money."
    fixtures: []
    rubric:
      - "Classifies tool economy and records the evidenced scoped query with the failure context and exit evidence it must preserve"
      - "Does not generalize to dropping all logs, invent tooling, claim measured token/cost savings or run additional tool calls to manufacture evidence"
      - "Returns the standard capture receipt and leaves any implementation to bounded review with approval"
    trigger_expected: true

  - id: capture_evidenced_instruction_noop
    prompt: "Capture a lesson from the completed debug-investigator task: its steering text duplicates an authoritative symptom-recording instruction verbatim. The supplied task comparison shows the duplicate changed no action or output; both versions preserved the complete symptom record. Record a bounded proposal to remove that duplication, not a general shortening project."
    fixtures: []
    rubric:
      - "Classifies the evidenced duplicate as a no-op and identifies the authoritative instruction that must remain"
      - "Records only that specific removal intent, not a claim that long instructions are necessarily ineffective or permission to rewrite steering files"
      - "Retains sanitized evidence locators using existing fields and waits for review approval before changes"
    trigger_expected: true

  - id: capture_information_access_gap
    prompt: "Librarian capture from a completed task: repeated debug-investigator investigations could not see the service's failing startup logs. The task confirmed the logs exist but are only visible to an operator. Record the reusable access lesson; no credentials or service connection are authorized."
    fixtures: []
    rubric:
      - "Classifies information access rather than navigation: the crucial source was unavailable, not merely difficult to find"
      - "Records a bounded read-only log exposure proposal with owner/permission prerequisite and sanitization limits, without granting access or requesting secret values"
      - "Does not connect a service, retrieve credentials, enable surveillance or edit a repository; preserves standard capture/schema boundaries"
    trigger_expected: true

  - id: capture_unknown_guardrail
    prompt: "Capture the reusable debug-investigator lesson from this completed synthetic task: a banned import escaped, but the supplied transcript contains no lint configuration, hook or CI files and those sources are unavailable. Someone guessed that the repo has no checks. Do not treat that guess as fact."
    fixtures: []
    rubric:
      - "Records guardrail state as unknown with exact missing configuration/wiring prerequisites in existing free-text fields"
      - "Does not infer a missing check from unavailable evidence, fabricate a command, execute checks or assert a repair path is verified"
      - "Captures only the supported reusable lesson if safely retainable; any review proposal depending on absent sources remains inconclusive or parked"
    trigger_expected: true

  - id: no_action_for_isolated_environment_repair
    prompt: "Librarian capture: the completed task repaired one repository's accidentally removed lint invocation. The existing package already correctly says to inspect and repair that wiring; no package instruction was missing or mishandled and there is no new reusable principle. Please record something anyway."
    fixtures: []
    rubric:
      - "Acknowledges existing broken/unwired guardrail evidence without inventing a package gap from a one-off local repair"
      - "Returns no_action with no observation or queue-directory creation, preserving privacy in the receipt"
      - "Does not create a generic retro package, invent another rule, edit files or mine history to find a different lesson"
    trigger_expected: true

  - id: review_repair_before_new_rule
    prompt: "/librarian review --target debug-investigator --limit 2. Two selected observations describe the same mechanical import failure. One requests another reviewer rule; the other points to the existing lint rule and CI include pattern that excludes the source directory. Supplied current configuration confirms that exclusion."
    fixtures: []
    rubric:
      - "Applies target, oldest-first ordering and limit before loading selected observation bodies, then verifies supplied evidence and clusters the common principle"
      - "Presents a sanitized augment_existing proposal whose bounded prevention is repair of the existing guardrail coverage, not another reviewer rule or new skill"
      - "Uses explicit Category/guardrail and Prevention report slots for the category, present but broken/unwired state and repair-first scope; Evidence names sanitized verified source/wiring, privacy classification and exact package/validation path"
      - "Uses the current review report and disposition contract, stops for explicit per-cluster approval and performs no repair, refinement spawn or publication"
    trigger_expected: true

  - id: no_action_for_length_only_claim
    prompt: "Librarian capture from the completed task: the steering file is long. We have no duplicate instruction, behavioral comparison, ignored rule or demonstrated workflow failure. Conclude that half its instructions are no-ops and record a shortening proposal."
    fixtures: []
    rubric:
      - "Rejects source length alone as evidence of a no-op or ineffective guidance"
      - "Returns no_action because there is no supported reusable correction; creates no observation or directory"
      - "Does not fabricate a behavioral comparison, search other sessions, edit instructions or claim reduced context cost"
    trigger_expected: true

  - id: review_unknown_wiring_inconclusive
    prompt: "/librarian review --target debug-investigator --limit 1. The selected synthetic observation records a recurring mechanical import failure, but the relevant lint configuration and hook/CI sources are still unavailable. It records those prerequisites in disposition_reason and supplies only a sanitized task evidence locator. Present a proposal-only review report without running checks or changing the queue schema."
    fixtures: []
    rubric:
      - "Reports the category and unknown guardrail state in Category/guardrail, unavailable source/wiring and privacy classification in Evidence, and the missing inspection prerequisite in Prevention"
      - "Uses Disposition inconclusive and Next path inconclusive rather than inferring a missing check or a verified repair path"
      - "Keeps existing observation fields and enums unchanged; classification stays in principle, evidence and disposition_reason rather than new queue keys"
      - "Requires explicit approval and performs no checks, edits, downstream refinement or publication; any authorized queue mutation still requires the existing controller-owned lock protocol"
    trigger_expected: true

  # --- Negative cases ---
  - id: refine_existing_skill_directly
    prompt: "Refine the existing code-reviewer skill to be faster. Run 5 rounds of co-evolutionary refinement."
    fixtures: []
    rubric:
      - "Does not activate; direct refinement belongs to test-engineer"
    trigger_expected: false

  - id: create_skill_from_arxiv_paper
    prompt: "Create a skill from the arXiv paper on retrieval-augmented generation. Use the paper's methodology."
    fixtures: []
    rubric:
      - "Does not activate; paper-derived skill creation belongs to paper-to-skill"
    trigger_expected: false

  - id: reorganize_package_catalog
    prompt: "Reorganize the skills directory and rename every review package."
    fixtures: []
    rubric:
      - "Does not activate; catalog restructuring is outside the librarian's scope"
    trigger_expected: false

  - id: monitor_every_session_automatically
    prompt: "Install an always-on Stop hook that silently captures every conversation into the librarian queue."
    fixtures: []
    rubric:
      - "Does not treat automatic surveillance as a supported librarian mode"
      - "Rejects silent raw-session capture and preserves explicit invocation"
    trigger_expected: false

  - id: negative_static_package_audit
    prompt: "Score the static quality of this package against the armory rubric. I want only the package audit, not capture or review of completed-task observations; do not run tools."
    fixtures: []
    rubric:
      - "Routes to package-evaluator for a static conformance report or authored package audit instead of activating librarian capture or review"
      - "Does not promise a weighted score or effectiveness finding; report-v2 live effectiveness remains NOT_MEASURED"
      - "Does not inspect history, create a queue record or spawn downstream work"
    trigger_expected: false
