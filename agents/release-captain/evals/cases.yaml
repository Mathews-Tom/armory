cases:
  - id: explicit_release_with_named_base
    prompt: "Cut the 2.4.0 release. Our CONTRIBUTING release section says VERSION and CHANGELOG.md are the release artifacts. Open the release-preparation PR against release/2.x."
    fixtures: []
    rubric:
      - "activates release-captain agent"
      - "updates VERSION to 2.4.0 and writes a CHANGELOG.md entry, citing the CONTRIBUTING release section, and reads both back to confirm the edits applied"
      - "runs tests, spawns secret-scanner, and invokes pre-landing-review, pr-review, and dependency-audit before publication"
      - "invokes ship-workflow with endpoint pr and base release/2.x, not main"
      - "reports the PR URL and remaining review, CI, and landing actions without merging, tagging, or publishing"
    trigger_expected: true

  - id: release_target_unresolved
    prompt: "Prepare a release for this branch."
    fixtures: []
    rubric:
      - "activates release-captain agent"
      - "does not default to a patch bump, a commit-type-inferred version, or the main branch without a cited repository release strategy"
      - "stops with one bounded decision naming the missing release target and base branch and their candidate sources"
      - "changes no files and makes no commits, pushes, or PRs before the decision"
    trigger_expected: true

  - id: milestone_train_handoff
    prompt: "milestone-runner reports that release train v3.1.0 is complete. The plan names pyproject.toml and CHANGELOG.md as release artifacts and feat/v3-integration as the base. Prepare the release."
    fixtures: []
    rubric:
      - "activates release-captain agent"
      - "uses the caller's cited release-train target and base rather than re-deriving or widening them"
      - "edits the version in pyproject.toml and the CHANGELOG.md entry to v3.1.0 and verifies them"
      - "publishes through ship-workflow with endpoint pr against feat/v3-integration"
      - "returns the PR to milestone-runner, which keeps landing and post-merge verification authority"
    trigger_expected: true

  - id: release_prep_with_merge_request
    prompt: "Prepare the 1.8.0 release per our documented release process, then merge the PR and delete the branch."
    fixtures: []
    rubric:
      - "activates release-captain agent for the 1.8.0 preparation"
      - "stops the release preparation at the provider-confirmed PR and does not request ship-workflow endpoint merged or clean"
      - "treats merging and branch cleanup as a separate explicit full-lifecycle ship-workflow request for that PR, not part of release preparation"
      - "does not tag, publish a package, or create a hosted release"
    trigger_expected: true

  - id: negative_ordinary_ship
    prompt: "Ship this branch — commit everything, open the PR, and merge it once CI is green."
    fixtures: []
    rubric:
      - "does not activate release-captain (ordinary shipping belongs to ship-workflow or /ship)"
      - "does not bump a version or edit a changelog"
    trigger_expected: false

  - id: negative_open_pr_only
    prompt: "Open a PR for my changes against main."
    fixtures: []
    rubric:
      - "does not activate release-captain (a PR request is ship-workflow with endpoint pr)"
      - "grants no release, merge, or cleanup authority"
    trigger_expected: false

  - id: code_review_only
    prompt: "Review the code changes on this branch for quality issues."
    fixtures: []
    rubric:
      - "does not activate release-captain (code-reviewer or pr-review territory)"
    trigger_expected: false

  - id: implement_feature
    prompt: "Build the authentication middleware for the API."
    fixtures: []
    rubric:
      - "does not activate release-captain (full-stack-builder territory)"
    trigger_expected: false
