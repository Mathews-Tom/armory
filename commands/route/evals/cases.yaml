cases:
  - id: route_explicit_command
    prompt: "/route I need to review a pull request"
    fixtures: []
    rubric:
      - "activates route command"
      - "recommends pr-review skill as primary"
      - "suggests code-refiner as complement"
    trigger_expected: true

  - id: route_ambiguous_task
    prompt: "/route I need to check my code"
    fixtures: []
    rubric:
      - "activates route command"
      - "asks clarifying question to distinguish review vs. security vs. refactor"
    trigger_expected: true

  - id: route_business_idea
    prompt: "which skill should I use to validate a startup idea?"
    fixtures: []
    rubric:
      - "recommends idea-validator or idea-scout"
      - "mentions business validation presets as alternative"
    trigger_expected: true

  - id: route_research_task
    prompt: "/route I want to research the state of WebAssembly for server-side rendering"
    fixtures: []
    rubric:
      - "recommends research-analyst agent as primary"
      - "may suggest literature-review or web-fetch as complements"
    trigger_expected: true

  - id: route_shipping
    prompt: "find the right skill for creating a release with changelog"
    fixtures: []
    rubric:
      - "recommends release-captain agent as primary for explicit release preparation"
      - "mentions changelog-composer as complement"
      - "does not recommend ordinary ship-workflow shipping as the owner of version or changelog changes"
    trigger_expected: true

  - id: route_full_ship
    prompt: "/route I want to finish this branch: get CI green, merge the PR, and clean up the branch"
    fixtures: []
    rubric:
      - "recommends the /ship command backed by the ship-workflow skill"
      - "does not recommend release-captain or any version or changelog change"
    trigger_expected: true

  - id: route_open_pr_only
    prompt: "/route which package should just open a PR for my branch?"
    fixtures: []
    rubric:
      - "recommends ship-workflow with endpoint pr"
      - "states that the route grants no merge, branch cleanup, or release authority"
    trigger_expected: true

  - id: route_stack_topology
    prompt: "/route my stacked PR chain needs a child rebased and retargeted after its parent changed"
    fixtures: []
    rubric:
      - "recommends stacked-prs skill as primary, with /stack-pr as the command surface"
      - "does not recommend release-captain or a full ship-workflow landing for a topology repair"
    trigger_expected: true

  - id: negative_direct_task
    prompt: "Review this PR for security issues"
    fixtures: []
    rubric:
      - "does not activate route command (direct task — should invoke security-reviewer or pr-review directly)"
    trigger_expected: false

  - id: negative_code_generation
    prompt: "Write a function to parse CSV files"
    fixtures: []
    rubric:
      - "does not activate route command (direct implementation task, not a discovery question)"
    trigger_expected: false

  - id: route_html_hyperframes_video
    prompt: "/route I want to make a video from HTML and CSS rendered with Hyperframes"
    fixtures: []
    rubric:
      - "recommends html-video skill as primary"
      - "does not recommend remotion-video, because the user named HTML/Hyperframes rather than React"
    trigger_expected: true

  - id: route_explicit_manim_marketing
    prompt: "which skill should I use for a marketing video made with Manim?"
    fixtures: []
    rubric:
      - "recommends animate as primary because the engine was named explicitly"
      - "states that an explicit engine outranks the content-type preference for remotion-video"
    trigger_expected: true

  - id: route_existing_video_analysis_vs_creation
    prompt: "/route I have a recorded product demo video and want a summary of what it shows"
    fixtures: []
    rubric:
      - "recommends watch skill as primary (analysis of an existing video)"
      - "does not recommend html-video, animate, or remotion-video, which create new videos"
    trigger_expected: true

  - id: route_plain_web_page_not_video
    prompt: "/route I need a static HTML and CSS landing page, no video"
    fixtures: []
    rubric:
      - "recommends static-web-artifacts-builder or a web-page oriented package"
      - "does not recommend html-video (no video output requested)"
    trigger_expected: true

  - id: route_async_external_intake
    prompt: "/route Draft questions for our billing lead to answer asynchronously so we can decide refund policy."
    fixtures: []
    rubric:
      - "recommends intake as primary for one external recipient's questionnaire"
      - "distinguishes sender context from recipient-held answers and does not conduct the recipient interview with the sender"
    trigger_expected: true

  - id: route_intake_missing_recipient
    prompt: "/route I need an async questionnaire, but have not picked who should receive it or which decisions it will inform."
    fixtures: []
    rubric:
      - "recommends intake and identifies its recipient/outcome clarification branch"
      - "does not recommend drafting a generic form or inventing an audience"
    trigger_expected: true

  - id: route_live_elicitation_not_intake
    prompt: "/route Interview me now to work out requirements for my project; nobody else will receive a questionnaire."
    fixtures: []
    rubric:
      - "recommends an appropriate live planning or discovery workflow, such as project-architect"
      - "does not recommend intake because there is no asynchronous external recipient"
    trigger_expected: true

  - id: route_persistent_human_learning
    prompt: "/route I want a human learning workspace with a mission, lessons and practice records that I can resume next month."
    fixtures: []
    rubric:
      - "recommends learning-workspace as primary"
      - "distinguishes persistent learner-owned evidence from one-off repo-tutor output and agent memory"
    trigger_expected: true

  - id: route_resume_learning_evidence
    prompt: "/route Resume my learning mission from recorded lessons, correct a misconception from yesterday's practice, and reconsider the mission."
    fixtures: []
    rubric:
      - "recommends learning-workspace for resume, practice evidence, misconception history and mission revision"
      - "does not treat an agent memory update or a one-off repository guide as completion"
    trigger_expected: true

  - id: route_one_off_repo_tutoring
    prompt: "/route Explain this repository once in an offline HTML guide; I do not want an ongoing learning workspace."
    fixtures: []
    rubric:
      - "recommends repo-tutor rather than learning-workspace"
      - "does not recommend walkthrough because no human-only operation is requested"
    trigger_expected: true

  - id: route_agent_memory_not_learning
    prompt: "/route I want the agent to remember my coding convention globally, not to teach me or track my learning."
    fixtures: []
    rubric:
      - "directs the request to the harness's actual agent-memory workflow, or identifies missing memory support"
      - "does not recommend learning-workspace or invent a package for global memory"
    trigger_expected: true

  - id: route_active_domain_challenge
    prompt: "/route Challenge whether cancellation applies to orders or individual units, confirm cardinalities, and reconcile code that contradicts our domain terms."
    fixtures: []
    rubric:
      - "recommends domain-modeling as primary for active scenario-driven challenge"
      - "does not substitute project-context-setup scaffolding or adr-writer decision recording"
    trigger_expected: true

  - id: route_context_scaffold_not_domain
    prompt: "/route Scaffold repo-local agent context, glossary layout and ADR lookup; our domain definitions are already agreed."
    fixtures: []
    rubric:
      - "recommends project-context-setup"
      - "does not recommend domain-modeling for unchanged agreed definitions or perform a new domain challenge"
    trigger_expected: true

  - id: route_adr_not_domain_modeling
    prompt: "/route Write an ADR documenting our already-made architecture decision and its alternatives."
    fixtures: []
    rubric:
      - "recommends adr-writer as primary"
      - "does not route ADR writing to domain-modeling or claim a vocabulary entry replaces a decision record"
    trigger_expected: true

  - id: route_unavoidable_human_operations
    prompt: "/route I need a repeatable procedure for dashboard consent and hidden credential entry that only I can perform."
    fixtures: []
    rubric:
      - "recommends walkthrough and keeps human-only operations separate from agent-doable preparation"
      - "does not ask for secrets in chat or treat repository onboarding as the task"
    trigger_expected: true

  - id: route_human_cutover_approval
    prompt: "/route A physical operator must approve an irreversible cutover; help deliver a sourced guided procedure."
    fixtures: []
    rubric:
      - "recommends walkthrough for the unavoidable human approval branch"
      - "does not interpret routing as authority to execute the cutover"
    trigger_expected: true

  - id: route_agent_doable_setup
    prompt: "/route Set up this repository using the tools and permissions already available to the agent; no human-only step exists."
    fixtures: []
    rubric:
      - "keeps setup in the ordinary agent workflow, with env-validator only if configuration validation is needed"
      - "does not recommend walkthrough or manufacture a human ceremony"
    trigger_expected: true

  - id: route_prototype_decision_evidence
    prompt: "/route Our design destination is uncertain; use a disposable prototype to gather evidence before resolving the decision."
    fixtures: []
    rubric:
      - "recommends decision-map with its prototype evidence branch"
      - "does not invent a separate prototype skill or route directly to production implementation"
      - "keeps implementation planning under plan-prompts only after decisions are resolved"
    trigger_expected: true
