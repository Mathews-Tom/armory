cases:
  - id: negative_deprecated_visual_assets
    prompt: "I need to create visual content — images, videos, and presentations for a product launch"
    fixtures: []
    rubric:
      - "does not activate media-craft preset (deprecated — use media-producer agent)"
    trigger_expected: false

  - id: negative_code_linting
    prompt: "Set up Python linting and type checking for my project"
    fixtures: []
    rubric:
      - "code quality tooling is covered by the python-strict preset, not media-craft"
    trigger_expected: false

  - id: negative_literature_review
    prompt: "I need to do a systematic literature review for my thesis"
    fixtures: []
    rubric:
      - "academic research workflows are covered by research-analyst agent, not media-craft"
    trigger_expected: false

  - id: html_video_routes_to_standalone_skill
    prompt: "Render an HTML and CSS title sequence to MP4 with Hyperframes"
    fixtures: []
    rubric:
      - "does not activate media-craft preset (deprecated); explicit Hyperframes requests route to the standalone html-video skill, not concept-to-video or remotion-video"
    trigger_expected: false

  - id: negative_plain_html_page
    prompt: "Build a single HTML landing page with a CSS animated hero section"
    fixtures: []
    rubric:
      - "an ordinary web page with no video output is not a media-craft or html-video request"
    trigger_expected: false
