cases:
  # --- Positive cases ---
  - id: install_evolution_pipeline
    prompt: "I want to set up an automated skill generation pipeline. Install the skill evolution tools."
    fixtures: []
    rubric:
      - "Recommends the skill-evolution preset"
      - "Lists all included packages (test-engineer, surrogate-verifier, skill-distiller, etc.)"
    trigger_expected: true

  # --- Negative cases ---
  - id: not_core_preset
    prompt: "Set up basic code review and commit standards for my project"
    fixtures: []
    rubric:
      - "Should NOT activate — this is the core preset, not skill-evolution"
    trigger_expected: false

  - id: not_security_preset
    prompt: "Install security auditing tools for compliance scanning"
    fixtures: []
    rubric:
      - "Should NOT activate — this is the security-engineer preset"
    trigger_expected: false

  - id: explain_evaluator_evidence_boundary
    prompt: "Explain the skill-evolution preset's package-evaluator role before installation. Does static PASS establish a six-dimensional quality score or prove the generated skill effective?"
    fixtures: []
    rubric:
      - "Describes report-v2 static conformance and separate evidence-backed authored review rather than six-dimensional quality scoring"
      - "Explains that unresolved CRITICAL/HIGH authored findings block acceptance even with static PASS"
      - "Retains live effectiveness NOT_MEASURED and distinguishes independent oracle assertion results"
      - "Does not install packages or launch evaluations merely to answer the question"
    trigger_expected: true
