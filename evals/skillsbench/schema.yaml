# SkillsBench task schema reference.
#
# Every file under evals/skillsbench/tasks/ is a single task with this shape.
# The runner (scripts/run_skillsbench.py) loads and validates tasks against
# this schema before executing.

id: string                   # Unique task identifier. Filename stem must match.
description: string          # One-line human-readable summary.
category: string             # development | research | review | content | ops
difficulty: string           # easy | medium | hard
prompt: string               # The task prompt delivered to the assistant (block).

# Success criterion. `assertion` checks final assistant output. `artifact`
# checks a safe relative file path in the task workspace and never accepts
# final-answer prose as a substitute.
success_criterion:
  type: assertion | artifact
  assertions: # Required only for `assertion`.
    - type: contains | not_contains | matches_regex
      target: string
      weight: 0.0-1.0
  artifact: # Required only for `artifact`.
    path: safe-relative-path
    assertions:
      - type: contains | not_contains | matches_regex
        target: string
        weight: 0.0-1.0
  pass_threshold: 0.0-1.0

# Execution bounds. The runner enforces these caps per attempt.
limits:
  max_turns: int             # Max conversation turns
  max_tokens: int            # Max total tokens (input + output, approximate)
  timeout_seconds: int       # Wall-clock cap

# Tags for later analysis. Keep short and consistent.
tags: [string]

# M3 frozen corpus declaration. `corpus.yaml` references retained task files
# or supplies equivalent inline task mappings and declares the complete matrix
# before any result exists.
schema_version: 1
model_fit:
  config: relative-path-to-model_fit.yaml
  target: declared-model-fit-target-id
comparison:
  baseline: current
  treatments: [reduced-or-rewritten, strengthened-contract]
  repetitions: 3 # Minimum; all task × condition × target × repetition cells exist.
  exclusions:
    - id: stable-exclusion-id
      rationale: Explicit reason the task class cannot enter this corpus.
tasks:
  - file: relative-path-to-retained-task.yaml
  - id: task_006_example
    # Inline task mapping with the task fields above.
